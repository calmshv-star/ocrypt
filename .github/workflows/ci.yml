name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -mod=readonly
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Verify formatting
        run: test -z "$(gofmt -l .)"
      - name: Test
        run: go test ./...
      - name: Build every executable
        run: go build ./cmd/...
      - name: Vet
        run: go vet ./...
      - name: Race test
        run: go test -race ./...

  schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: merchant
          POSTGRES_USER: merchant
          POSTGRES_PASSWORD: merchant-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U merchant -d merchant"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      PGPASSWORD: merchant-ci-only
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Pre-create least-privilege capability roles
        run: |
          psql -h 127.0.0.1 -U merchant -d merchant -v ON_ERROR_STOP=1 -f deploy/postgres/bootstrap-roles.sql
          psql -h 127.0.0.1 -U merchant -d merchant -v ON_ERROR_STOP=1 <<'SQL'
          ALTER ROLE merchant_api_runtime SUPERUSER LOGIN CREATEDB CREATEROLE REPLICATION BYPASSRLS;
          ALTER ROLE merchant_scanner_worker LOGIN NOBYPASSRLS;
          ALTER ROLE retention_archive_worker SUPERUSER LOGIN CREATEDB CREATEROLE REPLICATION BYPASSRLS;
          SQL
          psql -h 127.0.0.1 -U merchant -d merchant -v ON_ERROR_STOP=1 -f deploy/postgres/bootstrap-roles.sql
          psql -h 127.0.0.1 -U merchant -d merchant -v ON_ERROR_STOP=1 <<'SQL'
          DO $$ BEGIN
            IF EXISTS(SELECT 1 FROM pg_roles WHERE rolname IN('merchant_api_runtime','merchant_scanner_worker','retention_archive_worker') AND (rolsuper OR rolcanlogin OR rolcreatedb OR rolcreaterole OR rolreplication)) THEN
              RAISE EXCEPTION 'bootstrap did not converge dangerous role attributes';
            END IF;
            IF (SELECT rolbypassrls FROM pg_roles WHERE rolname='merchant_api_runtime')
               OR (SELECT rolbypassrls FROM pg_roles WHERE rolname='retention_archive_worker')
               OR NOT (SELECT rolbypassrls FROM pg_roles WHERE rolname='merchant_scanner_worker') THEN
              RAISE EXCEPTION 'bootstrap did not converge RLS attributes';
            END IF;
          END $$;
          SQL
      - name: Apply all migrations in order
        run: |
          while IFS= read -r migration; do
            psql -h 127.0.0.1 -U merchant -d merchant -v ON_ERROR_STOP=1 -f "$migration"
          done < <(find backend/migrations -maxdepth 1 -type f -name '*.up.sql' | sort)
          psql -h 127.0.0.1 -U merchant -d merchant -v ON_ERROR_STOP=1 -f deploy/postgres/runtime-grants.sql
      - name: Assert runtime role boundaries
        run: |
          psql -h 127.0.0.1 -U merchant -d merchant -v ON_ERROR_STOP=1 <<'SQL'
          DO $$ BEGIN
            IF EXISTS (SELECT 1 FROM pg_roles WHERE rolname IN ('merchant_api_runtime','merchant_management_runtime','merchant_admin_runtime','platform_admin_runtime','platform_outbox_publisher','merchant_financial_runtime','rate_runtime_worker','merchant_settings_api_runtime','merchant_session_revocation_worker','merchant_invitation_delivery_worker','retention_archive_worker','migration_control_worker','migration_traffic_actuator') AND rolbypassrls) THEN
              RAISE EXCEPTION 'merchant/control runtime role unexpectedly bypasses RLS';
            END IF;
            IF (SELECT count(*) FROM pg_roles WHERE rolname IN ('merchant_scanner_worker','merchant_settlement_worker','merchant_matching_worker','merchant_callback_worker','merchant_outbox_worker','merchant_resolution_worker','merchant_proof_worker','merchant_plan_worker','merchant_financial_worker','merchant_reconciliation_worker') AND rolbypassrls) <> 10 THEN
              RAISE EXCEPTION 'cross-tenant worker BYPASSRLS inventory differs';
            END IF;
            IF NOT has_table_privilege('merchant_api_runtime','event_history','SELECT')
               OR NOT has_table_privilege('merchant_api_runtime','reconciliation_reports','INSERT')
               OR NOT has_table_privilege('merchant_api_runtime','sandbox_workspaces','SELECT,INSERT,UPDATE')
               OR NOT has_table_privilege('merchant_api_runtime','sandbox_scenarios','SELECT,INSERT,UPDATE,DELETE')
               OR NOT has_table_privilege('merchant_api_runtime','sandbox_events','SELECT,INSERT')
               OR NOT has_table_privilege('merchant_api_runtime','sandbox_callbacks','SELECT,INSERT,UPDATE')
               OR NOT has_table_privilege('merchant_api_runtime','sandbox_callback_attempts','SELECT,INSERT')
               OR NOT has_table_privilege('merchant_api_runtime','sandbox_idempotency','SELECT,INSERT,DELETE')
               OR NOT has_function_privilege('merchant_api_runtime','sandbox_test_credential_admitted(uuid,uuid,text)','EXECUTE')
               OR NOT has_table_privilege('merchant_scanner_worker','ledger_transactions','INSERT')
               OR NOT has_table_privilege('merchant_scanner_worker','outbox_events','INSERT')
               OR NOT has_table_privilege('merchant_matching_worker','outbox_events','INSERT')
               OR NOT has_table_privilege('merchant_resolution_worker','outbox_events','INSERT')
               OR NOT has_table_privilege('merchant_proof_worker','ledger_entries','INSERT')
               OR NOT has_table_privilege('merchant_proof_worker','payment_routes','UPDATE')
               OR NOT has_table_privilege('merchant_plan_worker','payment_intents','UPDATE')
               OR NOT has_table_privilege('merchant_plan_worker','callback_events','INSERT')
               OR NOT has_table_privilege('merchant_plan_worker','outbox_events','INSERT')
               OR NOT has_table_privilege('merchant_api_runtime','callback_events','INSERT')
               OR NOT has_table_privilege('merchant_api_runtime','management_webhook_verifications','SELECT')
               OR has_table_privilege('merchant_api_runtime','management_webhook_verifications','INSERT,UPDATE,DELETE')
               OR NOT has_table_privilege('merchant_reconciliation_worker','reconciliation_reports','UPDATE')
               OR NOT has_table_privilege('merchant_settings_api_runtime','merchant_members','UPDATE')
               OR NOT has_table_privilege('merchant_settings_api_runtime','merchant_session_revocation_signals','INSERT')
               OR NOT has_table_privilege('merchant_settings_api_runtime','merchant_invitation_delivery_jobs','INSERT')
               OR NOT has_table_privilege('merchant_settings_api_runtime','merchant_invitation_delivery_workers','SELECT')
               OR NOT has_table_privilege('merchant_admin_runtime','merchant_members','SELECT')
               OR NOT has_table_privilege('merchant_admin_runtime','merchant_member_role_bindings','SELECT')
               OR NOT has_table_privilege('merchant_admin_runtime','merchant_cabinet_role_permissions','SELECT')
               OR NOT has_function_privilege('merchant_settings_api_runtime','merchant_invitation_delivery_keys_admitted(text[])','EXECUTE')
               OR NOT has_function_privilege('merchant_admin_runtime','lookup_merchant_invitation(bytea)','EXECUTE')
               OR NOT has_function_privilege('merchant_admin_runtime','list_current_admin_merchant_memberships()','EXECUTE')
               OR NOT has_function_privilege('merchant_api_runtime','platform_route_runtime_admission(uuid,uuid,text,text)','EXECUTE')
               OR NOT has_function_privilege('merchant_management_runtime','platform_wallet_runtime_admission(uuid,uuid,text)','EXECUTE')
               OR NOT has_table_privilege('merchant_scanner_worker','platform_config_snapshots','SELECT')
               OR NOT has_table_privilege('merchant_scanner_worker','scanner_runtime_config_evidence','SELECT,INSERT')
               OR NOT has_table_privilege('platform_outbox_publisher','platform_admin_service_identities','SELECT')
               OR NOT has_table_privilege('platform_outbox_publisher','platform_admin_outbox','SELECT,UPDATE')
               OR NOT has_function_privilege('merchant_session_revocation_worker','consume_merchant_session_revocations(integer)','EXECUTE')
               OR EXISTS (
                 SELECT 1 FROM unnest(ARRAY[
                   'retention_policy_versions','retention_legal_holds','retention_archive_jobs',
                   'retention_archive_batches','retention_archive_batch_items',
                   'retention_archive_objects','retention_archive_index'
                 ]) AS table_name
                 WHERE NOT has_table_privilege('retention_archive_worker',table_name,'SELECT')
               )
               OR NOT has_function_privilege('retention_archive_worker','retention_claim_archive_batch(text,timestamptz,integer,integer)','EXECUTE')
               OR NOT has_function_privilege('retention_archive_worker','retention_acknowledge_archive(uuid,uuid,bigint,text,text,bigint,bytea,bytea,text,bytea,text,timestamptz,timestamptz,timestamptz)','EXECUTE')
               OR NOT has_function_privilege('retention_archive_worker','retention_fail_archive(uuid,uuid,bigint,text,timestamptz)','EXECUTE')
               OR NOT has_function_privilege('retention_archive_worker','retention_claim_prune(text,timestamptz,integer)','EXECUTE')
               OR NOT has_function_privilege('retention_archive_worker','retention_advance_prune(uuid,uuid,bigint,timestamptz)','EXECUTE')
               OR NOT has_function_privilege('retention_archive_worker','retention_worker_health(timestamptz,integer)','EXECUTE') THEN
              RAISE EXCEPTION 'runtime composite transaction grants are incomplete';
            END IF;
            IF NOT has_function_privilege('migration_control_worker','claim_migration_workload(uuid,text,integer)','EXECUTE')
               OR NOT has_function_privilege('migration_control_worker','migration_apply_watch_address(uuid,text,uuid,bigint,text,uuid,uuid,text,text,text)','EXECUTE')
               OR NOT has_function_privilege('migration_control_worker','migration_post_verified_opening(uuid,text,uuid,bigint,text,uuid)','EXECUTE')
               OR NOT has_function_privilege('migration_traffic_actuator','acknowledge_migration_actuator(uuid,bigint,bigint,text,text,text,text)','EXECUTE')
               OR has_table_privilege('migration_control_worker','migration_runs','INSERT,UPDATE,DELETE')
               OR has_table_privilege('migration_traffic_actuator','migration_runs','INSERT,UPDATE,DELETE') THEN
              RAISE EXCEPTION 'migration worker/actuator function-only boundary differs';
            END IF;
            IF EXISTS (
              SELECT 1 FROM unnest(ARRAY[
                'merchant_api_runtime','merchant_management_runtime','merchant_scanner_worker',
                'merchant_settlement_worker','merchant_matching_worker','merchant_resolution_worker',
                'merchant_proof_worker','merchant_plan_worker'
              ]) AS role_name
              WHERE NOT has_table_privilege(role_name,'merchant_event_sequences','SELECT,INSERT,UPDATE')
            ) OR has_table_privilege('merchant_reconciliation_worker','merchant_event_sequences','SELECT') THEN
              RAISE EXCEPTION 'callback sequence allocator role matrix differs';
            END IF;
            IF EXISTS (
              SELECT 1 FROM unnest(ARRAY[
                'merchant_api_runtime','merchant_management_runtime','merchant_scanner_worker',
                'merchant_settlement_worker','merchant_matching_worker','merchant_resolution_worker',
                'merchant_proof_worker','merchant_plan_worker'
              ]) AS role_name
              WHERE NOT has_table_privilege(role_name,'payment_intent_versions','INSERT')
            ) THEN
              RAISE EXCEPTION 'payment intent transition role cannot append an immutable version';
            END IF;
            IF has_table_privilege('merchant_scanner_worker','ledger_transactions','DELETE')
               OR has_table_privilege('merchant_api_runtime','sandbox_workspaces','DELETE')
               OR has_table_privilege('merchant_api_runtime','sandbox_events','UPDATE')
               OR has_table_privilege('merchant_api_runtime','sandbox_events','DELETE')
               OR has_table_privilege('merchant_api_runtime','sandbox_callbacks','DELETE')
               OR has_table_privilege('merchant_api_runtime','sandbox_callback_attempts','UPDATE')
               OR has_table_privilege('merchant_api_runtime','sandbox_callback_attempts','DELETE')
               OR has_table_privilege('merchant_api_runtime','sandbox_idempotency','UPDATE')
               OR has_table_privilege('merchant_proof_worker','payment_matches','DELETE')
               OR has_table_privilege('merchant_financial_worker','financial_refund_requests','DELETE')
               OR has_table_privilege('merchant_settings_api_runtime','merchant_members','DELETE')
               OR has_table_privilege('merchant_session_revocation_worker','merchant_session_revocation_signals','SELECT')
               OR has_table_privilege('merchant_invitation_delivery_worker','merchant_invitation_delivery_jobs','SELECT')
               OR has_table_privilege('merchant_admin_runtime','merchant_members','INSERT')
               OR has_table_privilege('merchant_admin_runtime','merchant_members','UPDATE')
               OR has_table_privilege('merchant_admin_runtime','merchant_members','DELETE')
               OR has_function_privilege('merchant_settings_api_runtime','consume_merchant_session_revocations(integer)','EXECUTE')
               OR has_function_privilege('merchant_settings_api_runtime','claim_merchant_invitation_delivery(uuid,integer)','EXECUTE')
               OR has_function_privilege('merchant_admin_runtime','consume_merchant_session_revocations(integer)','EXECUTE')
               OR has_function_privilege('merchant_admin_runtime','claim_merchant_invitation_delivery(uuid,integer)','EXECUTE')
               OR has_function_privilege('merchant_admin_runtime','merchant_invitation_delivery_keys_admitted(text[])','EXECUTE')
               OR has_table_privilege('merchant_scanner_worker','scanner_runtime_config_evidence','UPDATE')
               OR has_table_privilege('platform_outbox_publisher','platform_admin_outbox','INSERT')
               OR has_table_privilege('platform_outbox_publisher','platform_admin_outbox','DELETE')
               OR has_table_privilege('platform_outbox_publisher','platform_config_snapshots','SELECT')
               OR EXISTS (
                 SELECT 1
                 FROM unnest(ARRAY['callback_events','callback_deliveries','outbox_events','event_history']) AS table_name,
                      unnest(ARRAY['INSERT','UPDATE','DELETE','TRUNCATE']) AS privilege_name
                 WHERE has_table_privilege('retention_archive_worker',table_name,privilege_name)
               )
               OR has_function_privilege('retention_archive_worker','create_retention_policy_version(uuid,uuid,text,bigint,integer,integer,integer,boolean,timestamptz,text,timestamptz)','EXECUTE')
               OR has_function_privilege('retention_archive_worker','create_retention_legal_hold(uuid,uuid,text,text,uuid,text,uuid,text,text,timestamptz,timestamptz)','EXECUTE')
               OR has_function_privilege('retention_archive_worker','release_retention_legal_hold(uuid,text,text,timestamptz)','EXECUTE')
               OR has_sequence_privilege('merchant_api_runtime','ledger_transaction_sequence','USAGE')
               OR NOT has_sequence_privilege('merchant_scanner_worker','ledger_transaction_sequence','USAGE')
               OR NOT has_sequence_privilege('rate_runtime_worker','rate_collection_dead_letters_id_seq','USAGE') THEN
              RAISE EXCEPTION 'runtime role has an unadmitted destructive grant';
            END IF;
            IF NOT has_function_privilege('merchant_invitation_delivery_worker','merchant_invitation_delivery_keys_admitted(text[])','EXECUTE')
               OR NOT has_function_privilege('merchant_invitation_delivery_worker','merchant_invitation_delivery_heartbeat(uuid)','EXECUTE')
               OR NOT has_function_privilege('merchant_invitation_delivery_worker','claim_merchant_invitation_delivery(uuid,integer)','EXECUTE')
               OR NOT has_function_privilege('merchant_invitation_delivery_worker','complete_merchant_invitation_delivery(uuid,uuid,text)','EXECUTE')
               OR NOT has_function_privilege('merchant_invitation_delivery_worker','fail_merchant_invitation_delivery(uuid,uuid,text,integer,integer)','EXECUTE') THEN
              RAISE EXCEPTION 'invitation delivery worker function-only capability is incomplete';
            END IF;
            IF EXISTS (SELECT 1 FROM information_schema.role_table_grants WHERE grantee IN ('merchant_invitation_delivery_worker','merchant_session_revocation_worker'))
               OR EXISTS (SELECT 1 FROM information_schema.role_usage_grants WHERE grantee IN ('merchant_invitation_delivery_worker','merchant_session_revocation_worker') AND object_type='SEQUENCE') THEN
              RAISE EXCEPTION 'function-only merchant worker received a table or sequence capability';
            END IF;
          END $$;
          SET ROLE rate_runtime_worker;
          SELECT count(*) FROM platform_config_heads;
          RESET ROLE;
          SET ROLE merchant_api_runtime;
          SELECT count(*) FROM payment_intents;
          RESET ROLE;
          SQL
