  platform_outbox_destination_key: {file: "${PLATFORM_OUTBOX_DESTINATION_KEY_FILE:-/dev/null}"}
  platform_outbox_destination_bearer: {file: "${PLATFORM_OUTBOX_DESTINATION_TOKEN_FILE:-/dev/null}"}
  merchant_settings_assertion_key: {file: "${MERCHANT_SETTINGS_ASSERTION_KEY_FILE:-/dev/null}"}
  merchant_settings_tls_cert: {file: "${MERCHANT_SETTINGS_TLS_CERT_FILE:-/dev/null}"}
  merchant_settings_tls_key: {file: "${MERCHANT_SETTINGS_TLS_KEY_FILE:-/dev/null}"}
  merchant_settings_client_ca: {file: "${MERCHANT_SETTINGS_CLIENT_CA_FILE:-/dev/null}"}
  merchant_settings_server_ca: {file: "${MERCHANT_SETTINGS_SERVER_CA_FILE:-/dev/null}"}
  merchant_settings_client_cert: {file: "${MERCHANT_SETTINGS_INTERNAL_CLIENT_CERT_FILE:-/dev/null}"}
  merchant_settings_client_key: {file: "${MERCHANT_SETTINGS_INTERNAL_CLIENT_KEY_FILE:-/dev/null}"}
  merchant_invitation_notifier_bearer: {file: "${MERCHANT_SETTINGS_INVITE_NOTIFIER_BEARER_FILE:-/dev/null}"}
  merchant_invitation_notifier_ca: {file: "${MERCHANT_SETTINGS_INVITE_NOTIFIER_CA_FILE:-/dev/null}"}
  financial_assertion_key: {file: "${FINANCIAL_ASSERTION_KEY_FILE:-/dev/null}"}
  financial_ca: {file: "${FINANCIAL_CA_FILE:-/dev/null}"}
  financial_tls_cert: {file: "${FINANCIAL_TLS_CERT_FILE:-/dev/null}"}
  financial_tls_key: {file: "${FINANCIAL_TLS_KEY_FILE:-/dev/null}"}
  financial_client_ca: {file: "${FINANCIAL_CLIENT_CA_FILE:-/dev/null}"}
  financial_client_cert: {file: "${FINANCIAL_INTERNAL_CLIENT_CERT_FILE:-/dev/null}"}
  financial_client_key: {file: "${FINANCIAL_INTERNAL_CLIENT_KEY_FILE:-/dev/null}"}
  financial_monitor_client_cert: {file: "${FINANCIAL_MONITOR_CLIENT_CERT_FILE:-/dev/null}"}
  financial_monitor_client_key: {file: "${FINANCIAL_MONITOR_CLIENT_KEY_FILE:-/dev/null}"}
  financial_builder_token: {file: "${FINANCIAL_BUILDER_TOKEN_FILE:-/dev/null}"}
  financial_signer_token: {file: "${FINANCIAL_SIGNER_TOKEN_FILE:-/dev/null}"}
  financial_broadcaster_token: {file: "${FINANCIAL_BROADCASTER_TOKEN_FILE:-/dev/null}"}
  financial_finality_token: {file: "${FINANCIAL_FINALITY_TOKEN_FILE:-/dev/null}"}
  financial_event_sink_token: {file: "${FINANCIAL_EVENT_SINK_TOKEN_FILE:-/dev/null}"}
  reconciliation_api_s3_access_key_id: {file: "${RECONCILIATION_API_S3_ACCESS_KEY_ID_FILE:-/dev/null}"}
