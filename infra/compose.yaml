  migration_provider_public_keys: {file: "${MIGRATION_PROVIDER_PUBLIC_KEYS_FILE:-/dev/null}"}
  migration_provider_ca: {file: "${MIGRATION_PROVIDER_CA_FILE:-/dev/null}"}
  migration_provider_client_cert: {file: "${MIGRATION_PROVIDER_CLIENT_CERT_FILE:-/dev/null}"}
  migration_provider_client_key: {file: "${MIGRATION_PROVIDER_CLIENT_KEY_FILE:-/dev/null}"}
  migration_traffic_actuator_ca: {file: "${MIGRATION_ACTUATOR_CA_FILE:-/dev/null}"}
  migration_traffic_actuator_client_cert: {file: "${MIGRATION_ACTUATOR_CLIENT_CERT_FILE:-/dev/null}"}
  migration_traffic_actuator_client_key: {file: "${MIGRATION_ACTUATOR_CLIENT_KEY_FILE:-/dev/null}"}
