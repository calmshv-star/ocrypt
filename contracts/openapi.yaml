        request_id: { type: string }
    WebhookEvent:
      type: object
      additionalProperties: false
      required: [event_id, event_type, schema_version, sequence, occurred_at, merchant_id, livemode, payment_intent]
      allOf:
        - if:
            properties: { event_type: { const: payment.settled } }
            required: [event_type]
          then:
            required: [settlement]
            not: { anyOf: [{ required: [observation] }, { required: [resolution] }] }
        - if:
            properties: { event_type: { enum: [payment.observed, payment.confirming] } }
            required: [event_type]
          then:
            required: [observation]
            not: { anyOf: [{ required: [settlement] }, { required: [resolution] }] }
        - if:
            properties: { event_type: { const: payment.reorged } }
            required: [event_type]
          then:
            oneOf:
              - { required: [observation], not: { required: [settlement] } }
              - { required: [settlement], not: { required: [observation] } }
            not: { required: [resolution] }
        - if:
            properties: { event_type: { const: payment.resolution.updated } }
            required: [event_type]
          then:
            required: [resolution]
            not: { anyOf: [{ required: [observation] }, { required: [settlement] }] }
      properties:
        event_id: { type: string, minLength: 1 }
        event_type:
          type: string
          enum: [payment.intent.created, payment.route.created, payment.observed, payment.confirming, payment.partially_paid, payment.needs_review, payment.settled, payment.overpaid, payment.expired, payment.cancelled, payment.reorged, payment.resolution.updated]
        schema_version: { type: string, const: '1' }
        sequence: { type: integer, format: int64, minimum: 1 }
        occurred_at: { type: string, format: date-time }
        merchant_id: { type: string, minLength: 1 }
        livemode: { type: boolean }
        payment_intent: { $ref: '#/components/schemas/WebhookPaymentIntent' }
        settlement: { $ref: '#/components/schemas/WebhookSettlement' }
        observation: { $ref: '#/components/schemas/WebhookObservation' }
        resolution: { $ref: '#/components/schemas/WebhookResolution' }
      description: |
        Delivered with `Merchant-Webhook-Signature: t=<unix>,key=<key-id>,event=<event-id>,v1=<base64url-hmac>`.
        The delivery also sends `Merchant-Delivery-Id` and `Content-Digest`. The signing input is
        `<event-id>.<unix timestamp>.<exact HTTP body>`. Replays retain the event ID and canonical body,
        but receive a new delivery ID, timestamp, and signature. A successful consumer must return a
        2xx JSON body with exactly the matching `acknowledged_event_id`; empty, malformed, or mismatched
        acknowledgements are retried and eventually dead-lettered.
    WebhookPaymentIntent:
      type: object
      additionalProperties: false
      required: [id, merchant_order_id, status, amount_minor, currency]
      properties:
        id: { type: string, minLength: 1 }
        merchant_order_id: { type: string, minLength: 1 }
        status: { $ref: '#/components/schemas/PaymentIntentStatus' }
        amount_minor: { $ref: '#/components/schemas/PositiveAtomicAmount' }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
    WebhookSettlement:
      type: object
      additionalProperties: false
      required: [settlement_id, asset_id, expected_raw, received_raw, credited_raw, finality, manual_resolution]
      oneOf:
        - required: [network, transaction_hash, event_index, block_height, block_time]
          not:
            anyOf:
              - required: [provider_id]
              - required: [provider_reference]
              - required: [provider_event_id]
              - required: [provider_evidence_sha256]
        - required: [provider_id, provider_reference, provider_event_id, provider_evidence_sha256]
          not:
            anyOf:
              - required: [network]
              - required: [transaction_hash]
              - required: [event_index]
              - required: [block_height]
              - required: [block_time]
      properties:
        settlement_id: { type: string, minLength: 1 }
        asset_id: { type: string, minLength: 1 }
        network: { type: string, minLength: 1 }
        expected_raw: { $ref: '#/components/schemas/AtomicAmount' }
        received_raw: { $ref: '#/components/schemas/PositiveAtomicAmount' }
        credited_raw: { $ref: '#/components/schemas/AtomicAmount' }
        transaction_hash: { type: string, minLength: 1 }
        event_index: { type: string, minLength: 1 }
        block_height: { $ref: '#/components/schemas/AtomicAmount' }
        block_time: { type: string, format: date-time }
        provider_id: { type: string, minLength: 1, maxLength: 128 }
        provider_reference: { type: string, minLength: 1, maxLength: 255 }
        provider_event_id: { type: string, minLength: 1, maxLength: 255 }
        provider_evidence_sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        finality: { type: string, enum: [observed, confirmed, finalized, reorged, provider_verified] }
        manual_resolution: { type: boolean }
    WebhookObservation:
      type: object
      additionalProperties: false
      required: [observation_id, payment_route_id, network, asset_id, transaction_hash, event_index, from_address, to_address, amount_raw, asset_decimals, block_height, block_hash, block_time, confirmations, required_confirmations, finality, evidence_sha256]
      properties:
        observation_id: { type: string, minLength: 1 }
        payment_route_id: { type: string, minLength: 1 }
        network: { type: string, minLength: 1 }
        asset_id: { type: string, minLength: 1 }
        transaction_hash: { type: string, minLength: 1 }
        event_index: { type: string, minLength: 1 }
        from_address: { type: string, minLength: 1 }
        to_address: { type: string, minLength: 1 }
        amount_raw: { $ref: '#/components/schemas/PositiveAtomicAmount' }
        asset_decimals: { type: integer, minimum: 0, maximum: 77 }
