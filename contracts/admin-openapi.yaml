  /admin/v1/team/invitations/accept:
    post:
      tags: [Merchant management]
      summary: Accept an opaque invitation with the matching invitation-bound OIDC session
      description: >-
        Tenant and merchant headers are forbidden. The BFF derives scope only from a canonical
        token hash lookup and requires the session's bound invitation ID and verified email to
        match; an already-active verified identity may accept a fresh matching-email invitation.
        A used token is visible only to the exact user/session enrollment that accepted it, solely
        to replay the same idempotency key after a lost response. Acceptance creates merchant membership in the private service and, in the same
        PostgreSQL transaction, activates any inert JIT identity and promotes that session.
        The JIT path creates no platform role binding or financial permission. Invalid, expired,
        revoked, used or differently bound invitations are indistinguishable.
      security: [{sessionCookie: [], csrfHeader: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [token], properties: {token: {type: string, minLength: 43, maxLength: 43, pattern: '^[A-Za-z0-9_-]{43}$'}}}}}}
      responses:
        '200': {description: Created or restored merchant membership, content: {application/json: {schema: {$ref: './merchant-settings-openapi.yaml#/components/schemas/Member'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
