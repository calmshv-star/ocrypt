openapi: 3.1.0
info:
  title: Merchant Platform Admin BFF API
  version: 1.0.0
  description: >-
    Same-origin operator control plane. It uses an opaque server-side session;
    merchant HMAC credentials and signing secrets are never accepted from or
    returned to the browser. All financial overrides require a recent MFA
    step-up and an independent second operator before the core verifier runs.
servers:
  - url: https://admin.example
    description: Replace with the exact ADMIN_PUBLIC_ORIGIN. Cross-origin use is unsupported.
tags:
  - name: Authentication
  - name: Operations
  - name: Read models
  - name: Availability
  - name: Merchant management
  - name: Matching policies
  - name: Platform configuration
  - name: Migration control
  - name: Provider configuration
  - name: Retention control
paths:
  /admin/v1/auth/login:
    get:
      tags: [Authentication]
      summary: Start OIDC authorization-code with PKCE
      security: []
      parameters:
        - {name: return, in: query, schema: {type: string, pattern: '^/(?!/)'}, required: false}
      responses:
        '303': {description: Redirect to the pinned OIDC authorization endpoint}
        '400': {$ref: '#/components/responses/Problem'}
  /admin/v1/auth/invitation:
    post:
      tags: [Authentication]
      summary: Start an invitation-bound OIDC enrollment with MFA and PKCE
      description: >-
        Same-origin browser initiation only. The BFF canonical-decodes the 43-character token,
        resolves its SHA-256 through lookup_merchant_invitation(bytea), and persists only the
        invitation ID, scope and normalized email in the one-time login attempt. The response
        never reflects the token or invitation metadata. Invalid, expired, revoked and used
        invitations are indistinguishable.
      security: []
      parameters:
        - {name: Origin, in: header, required: true, schema: {type: string, format: uri}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token: {type: string, minLength: 43, maxLength: 43, pattern: '^[A-Za-z0-9_-]{43}$'}
      responses:
        '200':
          description: Generic pinned authorization URL; an HttpOnly OIDC correlation cookie is set.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [authorization_url]
                properties: {authorization_url: {type: string, format: uri}}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
  /admin/v1/auth/callback:
    get:
      tags: [Authentication]
      summary: Consume one-time OIDC state and establish the admin session
      security: []
      parameters:
        - {name: state, in: query, required: true, schema: {type: string, minLength: 43}}
        - {name: code, in: query, required: true, schema: {type: string, minLength: 1}}
      responses:
        '303': {description: Session and CSRF cookies set; invitation callbacks receive an inert invitation-bound session and a generic /#/invite redirect}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /admin/v1/auth/step-up:
    get:
      tags: [Authentication]
      summary: Start a fresh MFA ceremony for sensitive operations
      parameters:
        - {name: return, in: query, schema: {type: string, pattern: '^/(?!/)'}, required: false}
      responses:
        '303': {description: Redirect to pinned OIDC endpoint with prompt=login and required ACR}
        '401': {$ref: '#/components/responses/Problem'}
  /admin/v1/session/me:
    get:
      tags: [Authentication]
      summary: Return server-derived roles, permissions and scopes
      responses:
        '200':
          description: Active principal. No merchant credentials are present.
          content: {application/json: {schema: {$ref: '#/components/schemas/Principal'}}}
        '401': {$ref: '#/components/responses/Problem'}
  /admin/v1/session/logout:
    post:
      tags: [Authentication]
      summary: Revoke the current server-side session
      security: [{sessionCookie: [], csrfHeader: []}]
      responses:
        '204': {description: Session revoked and cookies cleared}
        '403': {$ref: '#/components/responses/Problem'}
  /admin/v1/overview:
    get:
      tags: [Read models]
      summary: Operational overview
      parameters: [{$ref: '#/components/parameters/Tenant'}, {$ref: '#/components/parameters/Merchant'}]
      responses:
        '200': {description: Overview, content: {application/json: {schema: {$ref: '#/components/schemas/Overview'}}}}
        '403': {$ref: '#/components/responses/Problem'}
  /admin/v1/intents:
    get:
      tags: [Read models]
      summary: Payment intents page
      parameters: [{$ref: '#/components/parameters/Tenant'}, {$ref: '#/components/parameters/Merchant'}, {$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200': {description: Intents, content: {application/json: {schema: {$ref: '#/components/schemas/IntentPage'}}}}
        '403': {$ref: '#/components/responses/Problem'}
  /admin/v1/transfers:
    get:
      tags: [Read models]
      summary: On-chain transfers page
      parameters: [{$ref: '#/components/parameters/Tenant'}, {$ref: '#/components/parameters/Merchant'}, {$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200': {description: Transfers, content: {application/json: {schema: {$ref: '#/components/schemas/TransferPage'}}}}
        '403': {$ref: '#/components/responses/Problem'}
  /admin/v1/unmatched:
    get:
      tags: [Read models]
      summary: Merchant-scoped unmatched cases with latest candidate set only
      parameters: [{$ref: '#/components/parameters/Tenant'}, {$ref: '#/components/parameters/Merchant'}, {$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200': {description: Cases, content: {application/json: {schema: {$ref: '#/components/schemas/UnmatchedPage'}}}}
        '403': {$ref: '#/components/responses/Problem'}
  /admin/v1/webhooks/endpoints:
    get:
      tags: [Read models]
      summary: Webhook endpoint metadata and health; signing secrets are excluded
      parameters: [{$ref: '#/components/parameters/Tenant'}, {$ref: '#/components/parameters/Merchant'}, {$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200': {description: Endpoints, content: {application/json: {schema: {$ref: '#/components/schemas/WebhookPage'}}}}
    post:
      tags: [Merchant management]
      summary: Create a webhook endpoint and reveal its signing secret once
      security: [{sessionCookie: [], csrfHeader: []}]
      parameters: [{$ref: '#/components/parameters/Tenant'}, {$ref: '#/components/parameters/Merchant'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: './management-openapi.yaml#/components/schemas/WebhookEndpointInput'}}}}
      responses:
        '201': {description: Created endpoint and one-time secret, content: {application/json: {schema: {$ref: './management-openapi.yaml#/components/schemas/WebhookEndpointSecret'}}}}
        '403': {$ref: '#/components/responses/Problem'}
  /admin/v1/assets:
    get:
      tags: [Read models]
      summary: Assets and scanner health
      parameters: [{$ref: '#/components/parameters/Tenant'}, {$ref: '#/components/parameters/Merchant'}, {$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200': {description: Assets, content: {application/json: {schema: {$ref: '#/components/schemas/AssetPage'}}}}
  /admin/v1/financial-settings:
    get:
      tags: [Read models]
      summary: Effective merchant financial configuration without wallet addresses or secrets
      description: Read-only inventory of admitted fiat and crypto routes plus aggregate receiving capacity. Private keys, signer references and full addresses are never returned.
      parameters: [{$ref: '#/components/parameters/Tenant'}, {$ref: '#/components/parameters/Merchant'}]
      responses:
        '200': {description: Effective financial configuration, content: {application/json: {schema: {$ref: '#/components/schemas/FinancialSettingsInventory'}}}}
        '403': {$ref: '#/components/responses/Problem'}
  /admin/v1/reconciliation:
    get:
      tags: [Read models]
      summary: Tenant-level reconciliation runs
      description: Merchant-scoped callers receive no tenant-wide reconciliation rows.
      parameters: [{$ref: '#/components/parameters/Tenant'}, {$ref: '#/components/parameters/Merchant'}, {$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200': {description: Runs, content: {application/json: {schema: {$ref: '#/components/schemas/ReconciliationPage'}}}}
  /admin/v1/audit:
    get:
      tags: [Read models]
      summary: Tamper-evident scoped audit chain
      parameters: [{$ref: '#/components/parameters/Tenant'}, {$ref: '#/components/parameters/Merchant'}, {$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200': {description: Audit rows, content: {application/json: {schema: {$ref: '#/components/schemas/AuditPage'}}}}
  /admin/v1/unmatched/{id}/claim:
    post:
      tags: [Operations]
      summary: Claim a case using optimistic version and idempotency fences
      security: [{sessionCookie: [], csrfHeader: []}]
      parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/Tenant'}, {$ref: '#/components/parameters/Merchant'}]
      requestBody: {$ref: '#/components/requestBodies/OperatorCommand'}
      responses:
        '200': {description: Updated case, content: {application/json: {schema: {$ref: '#/components/schemas/Unmatched'}}}}
        '409': {$ref: '#/components/responses/Problem'}
  /admin/v1/unmatched/{id}/release:
    post:
      tags: [Operations]
      summary: Release a claimed case
      security: [{sessionCookie: [], csrfHeader: []}]
      parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/Tenant'}, {$ref: '#/components/parameters/Merchant'}]
      requestBody: {$ref: '#/components/requestBodies/OperatorCommand'}
      responses:
        '200': {description: Updated case, content: {application/json: {schema: {$ref: '#/components/schemas/Unmatched'}}}}
        '409': {$ref: '#/components/responses/Problem'}
  /admin/v1/unmatched/{id}/resolution-requests:
    post:
      tags: [Operations]
      summary: Create the real core manual resolution and request second approval
      description: >-
        Atomically fences the latest merchant candidate, case version and route,
        inserts core manual_resolutions in approval_required, updates the case,
        stores idempotency, and appends audit. AI output alone is never sufficient.
      security: [{sessionCookie: [], csrfHeader: []}]
      parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/Tenant'}, {$ref: '#/components/parameters/Merchant'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ResolutionInput'}}}
      responses:
        '202': {description: Pending independent approval, content: {application/json: {schema: {$ref: '#/components/schemas/Action'}}}}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /admin/v1/action-requests/{id}:
    get:
      tags: [Operations]
      summary: Inspect approval state
      parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/Tenant'}, {$ref: '#/components/parameters/Merchant'}]
      responses:
        '200': {description: Action, content: {application/json: {schema: {$ref: '#/components/schemas/Action'}}}}
  /admin/v1/action-requests/{id}/approve:
    post:
      tags: [Operations]
      summary: Approve with a different operator and queue independent verification
      security: [{sessionCookie: [], csrfHeader: []}]
      parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/Tenant'}, {$ref: '#/components/parameters/Merchant'}]
      requestBody: {$ref: '#/components/requestBodies/Decision'}
      responses:
        '200': {description: Core resolution moved to verification_requested, content: {application/json: {schema: {$ref: '#/components/schemas/Action'}}}}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /admin/v1/action-requests/{id}/reject:
    post:
      tags: [Operations]
      summary: Reject with a different operator and reopen the case
      security: [{sessionCookie: [], csrfHeader: []}]
      parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/Tenant'}, {$ref: '#/components/parameters/Merchant'}]
      requestBody: {$ref: '#/components/requestBodies/Decision'}
      responses:
        '200': {description: Rejected action, content: {application/json: {schema: {$ref: '#/components/schemas/Action'}}}}
        '403': {$ref: '#/components/responses/Problem'}
  /admin/v1/webhook-deliveries/{id}/replay:
    post:
      tags: [Operations]
      summary: Requeue a persisted failed delivery
      security: [{sessionCookie: [], csrfHeader: []}]
      parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/Tenant'}, {$ref: '#/components/parameters/Merchant'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ReplayInput'}}}
      responses:
        '204': {description: Delivery requeued}
        '409': {$ref: '#/components/responses/Problem'}
  /admin/v1/webhook-deliveries/{id}/retry:
    post:
      tags: [Merchant management]
      summary: Retry the same persisted delivery and event ID
      security: [{sessionCookie: [], csrfHeader: []}]
      parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/Tenant'}, {$ref: '#/components/parameters/Merchant'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: './management-openapi.yaml#/components/schemas/DangerousInput'}}}}
      responses:
        '200': {description: Delivery requeued, content: {application/json: {schema: {$ref: './management-openapi.yaml#/components/schemas/WebhookDelivery'}}}}
        '409': {$ref: '#/components/responses/Problem'}
  /admin/v1/api-clients:
    get:
      tags: [Merchant management]
      summary: List API clients without secrets
      parameters: [{$ref: '#/components/parameters/Tenant'}, {$ref: '#/components/parameters/Merchant'}, {$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200': {description: API client metadata, content: {application/json: {schema: {$ref: './management-openapi.yaml#/components/schemas/APIClientPage'}}}}
    post:
      tags: [Merchant management]
      summary: Create an API client and reveal its secret once
      security: [{sessionCookie: [], csrfHeader: []}]
      parameters: [{$ref: '#/components/parameters/Tenant'}, {$ref: '#/components/parameters/Merchant'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: './management-openapi.yaml#/components/schemas/APIClientInput'}}}}
      responses:
        '201': {description: Client and one-time secret, content: {application/json: {schema: {$ref: './management-openapi.yaml#/components/schemas/APIClientSecret'}}}}
  /admin/v1/payment-links:
    get:
      tags: [Merchant management]
      summary: List payment links without bearer capabilities
      parameters: [{$ref: '#/components/parameters/Tenant'}, {$ref: '#/components/parameters/Merchant'}, {$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200': {description: Payment links, content: {application/json: {schema: {$ref: './management-openapi.yaml#/components/schemas/PaymentLinkPage'}}}}
    post:
      tags: [Merchant management]
      summary: Create a payment link and reveal its public URL once
      security: [{sessionCookie: [], csrfHeader: []}]
      parameters: [{$ref: '#/components/parameters/Tenant'}, {$ref: '#/components/parameters/Merchant'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: './management-openapi.yaml#/components/schemas/PaymentLinkInput'}}}}
      responses:
        '201': {description: Payment link, content: {application/json: {schema: {$ref: './management-openapi.yaml#/components/schemas/PaymentLink'}}}}
  /admin/v1/payment-links/{id}:
    get:
      tags: [Merchant management]
      summary: Get payment-link metadata
      parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/Tenant'}, {$ref: '#/components/parameters/Merchant'}]
      responses:
        '200': {description: Payment link, content: {application/json: {schema: {$ref: './management-openapi.yaml#/components/schemas/PaymentLink'}}}}
  /admin/v1/payment-links/{id}/disable:
    post:
      tags: [Merchant management]
      summary: Disable a payment link with optimistic versioning
      security: [{sessionCookie: [], csrfHeader: []}]
      parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/Tenant'}, {$ref: '#/components/parameters/Merchant'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: './management-openapi.yaml#/components/schemas/VersionInput'}}}}
      responses:
        '200': {description: Disabled link, content: {application/json: {schema: {$ref: './management-openapi.yaml#/components/schemas/PaymentLink'}}}}
        '409': {$ref: '#/components/responses/Problem'}
  /admin/v1/checkout-sessions:
    post:
      tags: [Merchant management]
      summary: Issue a short-lived hosted or embedded checkout capability
      security: [{sessionCookie: [], csrfHeader: []}]
      parameters: [{$ref: '#/components/parameters/Tenant'}, {$ref: '#/components/parameters/Merchant'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: './management-openapi.yaml#/components/schemas/CheckoutIssueInput'}}}}
      responses:
        '201': {description: One-time checkout token and URL, content: {application/json: {schema: {$ref: './management-openapi.yaml#/components/schemas/CheckoutIssue'}}}}
  /admin/v1/webhooks/endpoints/{id}:
    get:
      tags: [Merchant management]
      summary: Get webhook endpoint metadata
      parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/Tenant'}, {$ref: '#/components/parameters/Merchant'}]
      responses:
        '200': {description: Endpoint, content: {application/json: {schema: {$ref: './management-openapi.yaml#/components/schemas/WebhookEndpoint'}}}}
    patch:
      tags: [Merchant management]
      summary: Update a webhook endpoint
      security: [{sessionCookie: [], csrfHeader: []}]
      parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/Tenant'}, {$ref: '#/components/parameters/Merchant'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: './management-openapi.yaml#/components/schemas/WebhookUpdateInput'}}}}
      responses:
        '200': {description: Updated endpoint, content: {application/json: {schema: {$ref: './management-openapi.yaml#/components/schemas/WebhookEndpoint'}}}}
  /admin/v1/webhooks/endpoints/{id}/verify:
    post:
      tags: [Merchant management]
      summary: Verify the endpoint with a pinned-public-IP challenge
      security: [{sessionCookie: [], csrfHeader: []}]
      parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/Tenant'}, {$ref: '#/components/parameters/Merchant'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false}}}}
      responses:
        '200': {description: Verified endpoint, content: {application/json: {schema: {$ref: './management-openapi.yaml#/components/schemas/WebhookEndpoint'}}}}
  /admin/v1/webhooks/endpoints/{id}/rotate-secret:
    post:
      tags: [Merchant management]
      summary: Rotate a webhook secret with bounded overlap
      security: [{sessionCookie: [], csrfHeader: []}]
      parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/Tenant'}, {$ref: '#/components/parameters/Merchant'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: './management-openapi.yaml#/components/schemas/OverlapInput'}}}}
      responses:
        '200': {description: Endpoint and one-time new secret, content: {application/json: {schema: {$ref: './management-openapi.yaml#/components/schemas/WebhookEndpointSecret'}}}}
  /admin/v1/webhooks/endpoints/{id}/deliveries:
    get:
      tags: [Merchant management]
      summary: List sanitized delivery history
      parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/Tenant'}, {$ref: '#/components/parameters/Merchant'}, {$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200': {description: Deliveries, content: {application/json: {schema: {$ref: './management-openapi.yaml#/components/schemas/WebhookDeliveryPage'}}}}
  /admin/v1/api-clients/{id}/rotate:
    post:
      tags: [Merchant management]
      summary: Rotate an API credential with bounded overlap
      security: [{sessionCookie: [], csrfHeader: []}]
      parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/Tenant'}, {$ref: '#/components/parameters/Merchant'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: './management-openapi.yaml#/components/schemas/OverlapInput'}}}}
      responses:
        '200': {description: Client and one-time new secret, content: {application/json: {schema: {$ref: './management-openapi.yaml#/components/schemas/APIClientSecret'}}}}
  /admin/v1/webhooks/endpoints/{id}/disable-requests:
    post:
      tags: [Merchant management]
      summary: Create a ten-minute four-eyes webhook-disable request
      security: [{sessionCookie: [], csrfHeader: []}]
      parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/Tenant'}, {$ref: '#/components/parameters/Merchant'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: './management-openapi.yaml#/components/schemas/DangerousInput'}}}}
      responses:
        '202': {description: Pending action, content: {application/json: {schema: {$ref: './management-openapi.yaml#/components/schemas/ManagementActionRequest'}}}}
  /admin/v1/api-clients/{id}/revoke-requests:
    post:
      tags: [Merchant management]
      summary: Create a ten-minute four-eyes API-client revoke request
      security: [{sessionCookie: [], csrfHeader: []}]
      parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/Tenant'}, {$ref: '#/components/parameters/Merchant'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: './management-openapi.yaml#/components/schemas/DangerousInput'}}}}
      responses:
        '202': {description: Pending action, content: {application/json: {schema: {$ref: './management-openapi.yaml#/components/schemas/ManagementActionRequest'}}}}
  /admin/v1/management-audit:
    get:
      tags: [Merchant management]
      summary: Read the management hash chain
      parameters: [{$ref: '#/components/parameters/Tenant'}, {$ref: '#/components/parameters/Merchant'}, {$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200': {description: Management audit, content: {application/json: {schema: {$ref: './management-openapi.yaml#/components/schemas/AuditPage'}}}}
  /admin/v1/management-actions/{category}:
    get:
      tags: [Merchant management]
      summary: List durable four-eyes management actions
      parameters: [{$ref: '#/components/parameters/ManagementActionCategory'}, {$ref: '#/components/parameters/Tenant'}, {$ref: '#/components/parameters/Merchant'}, {$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200': {description: Action requests, content: {application/json: {schema: {$ref: './management-openapi.yaml#/components/schemas/ManagementActionPage'}}}}
  /admin/v1/management-actions/{category}/{id}:
    get:
      tags: [Merchant management]
      summary: Get a durable four-eyes action
      parameters: [{$ref: '#/components/parameters/ManagementActionCategory'}, {$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/Tenant'}, {$ref: '#/components/parameters/Merchant'}]
      responses:
        '200': {description: Action request, content: {application/json: {schema: {$ref: './management-openapi.yaml#/components/schemas/ManagementActionRequest'}}}}
  /admin/v1/management-actions/{category}/{id}/approve:
    post:
      tags: [Merchant management]
      summary: Independently approve and execute the frozen dangerous mutation
      security: [{sessionCookie: [], csrfHeader: []}]
      parameters: [{$ref: '#/components/parameters/ManagementActionCategory'}, {$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/Tenant'}, {$ref: '#/components/parameters/Merchant'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: './management-openapi.yaml#/components/schemas/ManagementActionDecision'}}}}
      responses:
        '200': {description: Completed action or exact replay, content: {application/json: {schema: {$ref: './management-openapi.yaml#/components/schemas/ManagementActionRequest'}}}}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /admin/v1/management-actions/{category}/{id}/reject:
    post:
      tags: [Merchant management]
      summary: Independently reject the frozen dangerous mutation
      security: [{sessionCookie: [], csrfHeader: []}]
      parameters: [{$ref: '#/components/parameters/ManagementActionCategory'}, {$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/Tenant'}, {$ref: '#/components/parameters/Merchant'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: './management-openapi.yaml#/components/schemas/ManagementActionDecision'}}}}
      responses:
