  /admin/v1/financial/reconciliation-runs:
    get:
      tags: [Financial cabinet]
      summary: List tenant-scoped financial reconciliation runs
      parameters: [{$ref: '#/components/parameters/Tenant'}, {$ref: '#/components/parameters/FinancialAfter'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200': {description: Reconciliation page, content: {application/json: {schema: {$ref: './financial-openapi.yaml#/components/schemas/ReconciliationPageEnvelope'}}}}
        '403': {$ref: '#/components/responses/Problem'}
    post:
      tags: [Financial cabinet]
      summary: Request a deterministic financial reconciliation run
      security: [{sessionCookie: [], csrfHeader: []}]
      parameters: [{$ref: '#/components/parameters/Tenant'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [asset_ids], properties: {asset_ids: {type: array, minItems: 1, uniqueItems: true, items: {type: string}}}}}}}
      responses:
        '201': {description: Reconciliation aggregate, content: {application/json: {schema: {$ref: './financial-openapi.yaml#/components/schemas/ReconciliationEnvelope'}}}}
        '403': {$ref: '#/components/responses/Problem'}
  /admin/v1/financial/reconciliation-runs/{id}:
    get:
      tags: [Financial cabinet]
      summary: Get one reconciliation aggregate and its completed report evidence
      parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/Tenant'}]
      responses:
        '200': {description: Reconciliation aggregate, content: {application/json: {schema: {$ref: './financial-openapi.yaml#/components/schemas/ReconciliationEnvelope'}}}}
        '404': {$ref: '#/components/responses/Problem'}
  /admin/v1/financial/reconciliation-runs/{id}/execute:
    post:
      tags: [Financial cabinet]
      summary: Execute an evidence-only reconciliation as an independent approver
      security: [{sessionCookie: [], csrfHeader: []}]
      parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/Tenant'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [expected_version,cutoff_at,reason], properties: {expected_version: {type: integer, minimum: 1}, cutoff_at: {type: string, format: date-time}, reason: {type: string, minLength: 1, maxLength: 2048}}}}}}
      responses:
        '200': {description: Completed reconciliation aggregate, content: {application/json: {schema: {$ref: './financial-openapi.yaml#/components/schemas/ReconciliationEnvelope'}}}}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /admin/v1/providers:
    get:
      tags: [Provider operations]
      summary: List secret-free provider bindings and closed health state
      parameters: [{$ref: '#/components/parameters/PlatformTenant'}, {$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200': {description: Provider page, content: {application/json: {schema: {$ref: './platform-admin-openapi.yaml#/components/schemas/ProviderPage'}}}}
  /admin/v1/providers/{id}:
    get:
      tags: [Provider operations]
      summary: Get one secret-free provider binding
      parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/PlatformTenant'}]
      responses:
        '200': {description: Provider binding, content: {application/json: {schema: {$ref: './platform-admin-openapi.yaml#/components/schemas/ProviderBinding'}}}}
  /admin/v1/provider-change-requests:
    get:
      tags: [Provider operations]
      summary: List provider pause and unpause requests
      parameters: [{$ref: '#/components/parameters/PlatformTenant'}, {$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200': {description: Provider change page, content: {application/json: {schema: {$ref: './platform-admin-openapi.yaml#/components/schemas/ProviderChangePage'}}}}
  /admin/v1/provider-policy-requests:
    get:
      tags: [Provider operations]
      summary: List secret-free hosted provider policy requests and activation state
      parameters: [{$ref: '#/components/parameters/PlatformTenant'}, {$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200': {description: Hosted provider policy page, content: {application/json: {schema: {$ref: './platform-admin-openapi.yaml#/components/schemas/HostedProviderPolicyPage'}}}}
  /admin/v1/providers/{id}/pause-requests:
    post:
      tags: [Provider operations]
      summary: Request a provider pause with recent step-up and version fencing
      security: [{sessionCookie: [], csrfHeader: []}]
      parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/PlatformTenant'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: './platform-admin-openapi.yaml#/components/schemas/ProviderStatusRequest'}}}}
      responses:
        '202': {description: Pending independent approval, content: {application/json: {schema: {$ref: './platform-admin-openapi.yaml#/components/schemas/ProviderChangeRequest'}}}}
        '409': {$ref: '#/components/responses/Problem'}
  /admin/v1/providers/{id}/unpause-requests:
    post:
      tags: [Provider operations]
      summary: Request an approved-policy provider unpause with recent step-up
      security: [{sessionCookie: [], csrfHeader: []}]
      parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/PlatformTenant'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: './platform-admin-openapi.yaml#/components/schemas/ProviderStatusRequest'}}}}
      responses:
        '202': {description: Pending independent approval, content: {application/json: {schema: {$ref: './platform-admin-openapi.yaml#/components/schemas/ProviderChangeRequest'}}}}
        '409': {$ref: '#/components/responses/Problem'}
  /admin/v1/providers/{id}/policy-requests:
    post:
      tags: [Provider operations]
      summary: Request an immutable bounded hosted-provider policy and private bootstrap probe
      security: [{sessionCookie: [], csrfHeader: []}]
      parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/PlatformTenant'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: './platform-admin-openapi.yaml#/components/schemas/HostedProviderPolicyRequest'}}}}
      responses:
        '202': {description: Pending independent approval; the bootstrap reference is never returned, content: {application/json: {schema: {$ref: './platform-admin-openapi.yaml#/components/schemas/HostedProviderPolicyVersion'}}}}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /admin/v1/provider-change-requests/{id}/approve:
    post: {$ref: '#/components/pathItems/ProviderDecision'}
  /admin/v1/provider-change-requests/{id}/reject:
    post: {$ref: '#/components/pathItems/ProviderDecision'}
  /admin/v1/provider-policy-requests/{id}/approve:
    post: {$ref: '#/components/pathItems/HostedProviderPolicyDecision'}
  /admin/v1/provider-policy-requests/{id}/reject:
    post: {$ref: '#/components/pathItems/HostedProviderPolicyDecision'}
  /admin/v1/provider-config-versions:
    get:
      tags: [Provider configuration]
      summary: List scoped secret-free hosted-provider configuration versions
      parameters: [{$ref: '#/components/parameters/ProviderConfigurationTenant'}, {$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200': {description: Secret-free immutable configuration page, content: {application/json: {schema: {$ref: './platform-admin-openapi.yaml#/components/schemas/ProviderConfigurationPage'}}}}
        '403': {$ref: '#/components/responses/Problem'}
  /admin/v1/provider-config-versions/{id}:
    get:
      tags: [Provider configuration]
      summary: Get one scoped secret-free configuration version
      parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/ProviderConfigurationTenant'}]
      responses:
        '200': {description: Secret-free immutable configuration version, content: {application/json: {schema: {$ref: './platform-admin-openapi.yaml#/components/schemas/ProviderConfigurationVersion'}}}}
        '404': {$ref: '#/components/responses/Problem'}
  /admin/v1/provider-configurations/{id}/requests:
    post:
      tags: [Provider configuration]
      summary: Request an immutable provider configuration version with write-only external references
      description: Origins, paths, external file references and the private probe reference are accepted only on this write path and never returned to the browser, audit stream or outbox.
      security: [{sessionCookie: [], csrfHeader: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'}}
        - $ref: '#/components/parameters/ProviderConfigurationTenant'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: {required: true, content: {application/json: {schema: {$ref: './platform-admin-openapi.yaml#/components/schemas/ProviderConfigurationRequest'}}}}
      responses:
        '202': {description: Pending distinct approval, content: {application/json: {schema: {$ref: './platform-admin-openapi.yaml#/components/schemas/ProviderConfigurationVersion'}}}}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /admin/v1/provider-config-requests/{id}/approve:
    post: {$ref: '#/components/pathItems/ProviderConfigurationDecision'}
  /admin/v1/provider-config-requests/{id}/reject:
    post: {$ref: '#/components/pathItems/ProviderConfigurationDecision'}
  /admin/v1/retention/policies:
    get: {$ref: './retention-control-openapi.yaml#/paths/~1admin~1v1~1retention~1policies/get'}
  /admin/v1/retention/policy-requests:
    get: {$ref: './retention-control-openapi.yaml#/paths/~1admin~1v1~1retention~1policy-requests/get'}
    post: {$ref: './retention-control-openapi.yaml#/paths/~1admin~1v1~1retention~1policy-requests/post'}
  /admin/v1/retention/policy-requests/{id}/approve:
    post: {$ref: './retention-control-openapi.yaml#/paths/~1admin~1v1~1retention~1policy-requests~1{id}~1approve/post'}
  /admin/v1/retention/policy-requests/{id}/reject:
    post: {$ref: './retention-control-openapi.yaml#/paths/~1admin~1v1~1retention~1policy-requests~1{id}~1reject/post'}
  /admin/v1/retention/holds:
    get: {$ref: './retention-control-openapi.yaml#/paths/~1admin~1v1~1retention~1holds/get'}
    post: {$ref: './retention-control-openapi.yaml#/paths/~1admin~1v1~1retention~1holds/post'}
  /admin/v1/retention/holds/{id}/release-requests:
    post: {$ref: './retention-control-openapi.yaml#/paths/~1admin~1v1~1retention~1holds~1{id}~1release-requests/post'}
  /admin/v1/retention/hold-release-requests:
    get: {$ref: './retention-control-openapi.yaml#/paths/~1admin~1v1~1retention~1hold-release-requests/get'}
  /admin/v1/retention/hold-release-requests/{id}/approve:
    post: {$ref: './retention-control-openapi.yaml#/paths/~1admin~1v1~1retention~1hold-release-requests~1{id}~1approve/post'}
  /admin/v1/retention/hold-release-requests/{id}/reject:
    post: {$ref: './retention-control-openapi.yaml#/paths/~1admin~1v1~1retention~1hold-release-requests~1{id}~1reject/post'}
  /admin/v1/retention/archive-batches:
    get: {$ref: './retention-control-openapi.yaml#/paths/~1admin~1v1~1retention~1archive-batches/get'}
  /admin/v1/retention/tombstones:
    get: {$ref: './retention-control-openapi.yaml#/paths/~1admin~1v1~1retention~1tombstones/get'}
components:
  securitySchemes:
    sessionCookie: {type: apiKey, in: cookie, name: __Host-admin_session, description: Opaque random token; only SHA-256 is persisted.}
    csrfHeader: {type: apiKey, in: header, name: X-CSRF-Token, description: Must equal the Strict same-origin CSRF cookie and its server-side hash.}
  parameters:
    ID: {name: id, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
    Tenant: {name: X-Admin-Tenant-ID, in: header, required: true, schema: {$ref: '#/components/schemas/UUID'}}
    Merchant: {name: X-Admin-Merchant-ID, in: header, required: false, schema: {$ref: '#/components/schemas/UUID'}}
    RequiredMerchant: {name: X-Admin-Merchant-ID, in: header, required: true, schema: {$ref: '#/components/schemas/UUID'}}
    Cursor: {name: cursor, in: query, required: false, schema: {type: string, maxLength: 256}}
    Limit: {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
    FinancialAfter: {name: after, in: query, required: false, schema: {$ref: '#/components/schemas/UUID'}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 8, maxLength: 255}}
    ManagementActionCategory: {name: category, in: path, required: true, schema: {type: string, enum: [webhook-disable, api-client-revoke]}}
    PlatformTenant: {name: X-Admin-Tenant-ID, in: header, required: false, schema: {$ref: '#/components/schemas/UUID'}, description: Omit only for an explicitly global DB-backed platform grant.}
    ProviderConfigurationTenant: {name: X-Admin-Tenant-ID, in: header, required: true, schema: {$ref: '#/components/schemas/UUID'}, description: Exact tenant selected for the secret-free provider configuration control plane.}
  requestBodies:
    OperatorCommand:
      required: true
      content: {application/json: {schema: {$ref: '#/components/schemas/OperatorInput'}}}
    Decision:
      required: true
      content: {application/json: {schema: {type: object, additionalProperties: false, required: [reason], properties: {reason: {type: string, minLength: 1, maxLength: 1000}}}}}
    FinancialDecision:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [expected_version, reason]
            properties:
              expected_version: {type: integer, minimum: 1}
              reason: {type: string, minLength: 1, maxLength: 2048}
  responses:
    Problem:
      description: RFC 9457-style bounded public error; internal errors and PII are excluded.
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
    NotImplemented:
      description: Production endpoint intentionally fails closed; no fixture response is substituted.
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
  pathItems:
    MigrationDecision:
      tags: [Migration control]
      summary: Approve or reject as a distinct freshly stepped-up operator
      security: [{sessionCookie: [], csrfHeader: []}]
      parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/Tenant'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: './migration-control-openapi.yaml#/components/schemas/DecisionInput'}}}}
      responses:
        '200': {description: Dry-run report or versioned decision, content: {application/json: {schema: {oneOf: [{$ref: '#/components/schemas/MigrationAdmissionReport'}, {$ref: '#/components/schemas/MigrationTransitionRequest'}]}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
    ProviderConfigurationDecision:
      tags: [Provider configuration]
      summary: Approve or reject as a distinct freshly stepped-up operator
      security: [{sessionCookie: [], csrfHeader: []}]
      parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/ProviderConfigurationTenant'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: './platform-admin-openapi.yaml#/components/schemas/ProviderConfigurationDecision'}}}}
      responses:
        '200': {description: Decided configuration version, content: {application/json: {schema: {$ref: './platform-admin-openapi.yaml#/components/schemas/ProviderConfigurationVersion'}}}}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
    HostedProviderPolicyDecision:
      tags: [Provider operations]
      summary: Approve or reject immutable provider policy evidence as a distinct freshly stepped-up operator
      security: [{sessionCookie: [], csrfHeader: []}]
      parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/PlatformTenant'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: './platform-admin-openapi.yaml#/components/schemas/ProviderDecision'}}}}
      responses:
        '200': {description: Decided hosted provider policy, content: {application/json: {schema: {$ref: './platform-admin-openapi.yaml#/components/schemas/HostedProviderPolicyVersion'}}}}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
    ProviderDecision:
      tags: [Provider operations]
      summary: Approve or reject as a distinct freshly stepped-up operator
      security: [{sessionCookie: [], csrfHeader: []}]
      parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/PlatformTenant'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: './platform-admin-openapi.yaml#/components/schemas/ProviderDecision'}}}}
      responses:
        '200': {description: Decided provider change, content: {application/json: {schema: {$ref: './platform-admin-openapi.yaml#/components/schemas/ProviderChangeRequest'}}}}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
    FinancialSweepDecision:
      tags: [Financial cabinet]
      summary: Approve as a distinct operator or cancel with version fencing and durable replay
      security: [{sessionCookie: [], csrfHeader: []}]
      parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/Tenant'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/FinancialDecision'}
      responses:
        '200': {description: Sweep aggregate, content: {application/json: {schema: {$ref: './financial-openapi.yaml#/components/schemas/SweepEnvelope'}}}}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
    FinancialRefundDecision:
      tags: [Financial cabinet]
      summary: Approve as a distinct operator or cancel with version fencing and durable replay
      security: [{sessionCookie: [], csrfHeader: []}]
      parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/Tenant'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/FinancialDecision'}
      responses:
        '200': {description: Refund aggregate, content: {application/json: {schema: {$ref: './financial-openapi.yaml#/components/schemas/RefundEnvelope'}}}}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
    MemberMutation:
      tags: [Merchant management]
      summary: Disable or remove an ordinary member; high-risk targets require the security-action workflow
      security: [{sessionCookie: [], csrfHeader: []}]
      parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/Tenant'}, {$ref: '#/components/parameters/RequiredMerchant'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: './merchant-settings-openapi.yaml#/components/schemas/VersionReason'}}}}
      responses:
        '200': {description: Updated member, content: {application/json: {schema: {$ref: './merchant-settings-openapi.yaml#/components/schemas/Member'}}}}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
    SecurityActionDecision:
      tags: [Merchant management]
      summary: Decide as a distinct freshly MFA-authenticated merchant security administrator
      security: [{sessionCookie: [], csrfHeader: []}]
      parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/Tenant'}, {$ref: '#/components/parameters/RequiredMerchant'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: './merchant-settings-openapi.yaml#/components/schemas/VersionReason'}}}}
      responses:
        '200': {description: Decided security request, content: {application/json: {schema: {$ref: './merchant-settings-openapi.yaml#/components/schemas/SecurityAction'}}}}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
    PlatformDecision:
      post:
        tags: [Platform configuration]
        summary: Advance the four-eyes platform change workflow
        security: [{sessionCookie: [], csrfHeader: []}]
        parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/PlatformTenant'}, {$ref: '#/components/parameters/IdempotencyKey'}]
        requestBody: {required: true, content: {application/json: {schema: {$ref: './platform-admin-openapi.yaml#/components/schemas/DecisionInput'}}}}
        responses:
          '200': {description: Updated change, content: {application/json: {schema: {$ref: './platform-admin-openapi.yaml#/components/schemas/ChangeRequest'}}}}
          '403': {$ref: '#/components/responses/Problem'}
          '409': {$ref: '#/components/responses/Problem'}
    NotImplementedGet:
      tags: [Availability]
      summary: Dashboard surface is not connected to a production repository yet
      responses:
        '501': {$ref: '#/components/responses/NotImplemented'}
  schemas:
    UUID: {type: string, format: uuid, pattern: '^[0-9a-f-]{36}$'}
    MigrationAdmissionReport:
      type: object
      additionalProperties: false
      required: [dry_run, admissible, checks, blockers]
      properties:
        dry_run: {type: boolean}
        admissible: {type: boolean}
        checks: {type: array, maxItems: 64, items: {type: string, maxLength: 128}}
        blockers: {type: array, maxItems: 64, items: {type: string, maxLength: 256}}
        payload_hash: {type: string, pattern: '^[a-f0-9]{64}$'}
        target_state: {$ref: './migration-control-openapi.yaml#/components/schemas/State'}
    MigrationStoredManifest:
      type: object
      additionalProperties: false
      required: [id, migration_id, kind, payload_hash, signer_key_ids, created_at]
      properties:
        id: {$ref: '#/components/schemas/UUID'}
        migration_id: {$ref: '#/components/schemas/UUID'}
        kind: {type: string, enum: [inventory, dry_run, canary, cutover, decommission]}
        payload_hash: {type: string, pattern: '^[a-f0-9]{64}$'}
        signer_key_ids: {type: array, minItems: 2, maxItems: 2, uniqueItems: true, items: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:/@+-]{0,254}$'}}
        created_at: {type: string, format: date-time}
    MigrationTransitionRequest:
      type: object
      additionalProperties: false
      required: [id, migration_id, from_state, target_state, status, requested_by, expected_row_version, expected_fence_token, created_at, expires_at, version]
      properties:
        id: {$ref: '#/components/schemas/UUID'}
        migration_id: {$ref: '#/components/schemas/UUID'}
        from_state: {$ref: './migration-control-openapi.yaml#/components/schemas/State'}
        target_state: {$ref: './migration-control-openapi.yaml#/components/schemas/State'}
        status: {type: string, enum: [pending_approval, approved, rejected, expired, awaiting_actuator, executed]}
        requested_by: {$ref: '#/components/schemas/UUID'}
        approved_by: {$ref: '#/components/schemas/UUID'}
        expected_row_version: {type: integer, minimum: 1}
        expected_fence_token: {type: integer, minimum: 1}
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        decided_at: {type: string, format: date-time}
        version: {type: integer, minimum: 1}
    MigrationRunPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items: {type: array, maxItems: 200, items: {$ref: './migration-control-openapi.yaml#/components/schemas/Run'}}
        next_cursor: {type: string, maxLength: 256}
    Problem: {type: object, additionalProperties: false, required: [type,title,status,code,detail], properties: {type: {type: string}, title: {type: string}, status: {type: integer}, code: {type: string}, detail: {type: string}}}
    Scope: {type: object, additionalProperties: false, properties: {tenant_id: {$ref: '#/components/schemas/UUID'}, merchant_id: {$ref: '#/components/schemas/UUID'}}}
    Principal: {type: object, additionalProperties: false, required: [user_id,session_id,display_name,roles,permissions,scopes,amr], properties: {user_id: {$ref: '#/components/schemas/UUID'}, session_id: {$ref: '#/components/schemas/UUID'}, display_name: {type: string}, email: {type: string, format: email}, roles: {type: array, items: {type: string}}, permissions: {type: array, items: {type: string}}, scopes: {type: array, items: {$ref: '#/components/schemas/Scope'}}, acr: {type: string}, amr: {type: array, items: {type: string}}, step_up_until: {type: string, format: date-time}}}
    OverviewMoney:
      type: object
      additionalProperties: false
      required: [amount_minor, currency, currency_scale]
      properties:
        amount_minor: {type: string, pattern: '^[0-9]+$'}
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        currency_scale: {type: integer, minimum: 0, maximum: 9}
    OverviewFlowPoint:
      type: object
      additionalProperties: false
      required: [date, created, settled]
      properties:
        date: {type: string, format: date}
