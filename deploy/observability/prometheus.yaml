global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yaml

scrape_configs:
  - job_name: provider-health-metrics
    metrics_path: /metrics
    static_configs:
      - targets: ["provider-health-worker:9100"]
  - job_name: blackbox-health
    metrics_path: /probe
    params:
      module: [http_health]
    static_configs:
      - targets:
          - http://gateway:8080/healthz
          - http://api:8080/healthz
          - http://api:8080/readyz
          - http://admin-api:8081/healthz
          - http://admin-api:8081/readyz
          - http://settlement-worker:9090/healthz
          - http://settlement-worker:9090/readyz
          - http://matching-worker:9090/healthz
          - http://matching-worker:9090/readyz
          - http://callback-worker:9090/healthz
          - http://callback-worker:9090/readyz
          - http://outbox-worker:9090/healthz
          - http://outbox-worker:9090/readyz
          - http://plan-worker:9090/healthz
          - http://plan-worker:9090/readyz
          - http://scanner:9091/healthz
          - http://scanner:9091/readyz
          - http://provider-health-worker:9100/healthz
          - http://provider-health-worker:9100/readyz
          - http://rate-worker:9092/healthz
          - http://rate-worker:9092/readyz
          - http://reconciliation-worker:9094/healthz
          - http://reconciliation-worker:9094/readyz
          - http://merchant-settings-api:9095/healthz
          - http://merchant-settings-api:9095/readyz
          - http://merchant-session-revocation-worker:9096/healthz
          - http://merchant-session-revocation-worker:9096/readyz
          - http://merchant-invitation-delivery-worker:9097/healthz
          - http://merchant-invitation-delivery-worker:9097/readyz
          - http://financial-worker:9093/healthz
          - http://financial-worker:9093/readyz
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
  - job_name: blackbox-platform-tls-health
    metrics_path: /probe
    params:
      module: [https_platform_health]
    static_configs:
      - targets:
          - https://platform-admin-api:8446/healthz
          - https://platform-admin-api:8446/readyz
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
  - job_name: blackbox-management-tls-health
    metrics_path: /probe
    params:
      module: [https_management_health]
    static_configs:
      - targets:
          - https://management-api:8445/healthz
          - https://management-api:8445/readyz
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
  - job_name: blackbox-financial-tls-health
    metrics_path: /probe
    params:
      module: [https_financial_health]
    static_configs:
      - targets:
          - https://financial-api:8444/healthz
          - https://financial-api:8444/readyz
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
