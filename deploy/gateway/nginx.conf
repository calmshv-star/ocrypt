worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events { worker_connections 1024; }

http {
  access_log /dev/stdout combined;
  client_max_body_size 1m;
  proxy_http_version 1.1;
  proxy_request_buffering on;
  proxy_buffering on;
  proxy_connect_timeout 3s;
  proxy_read_timeout 30s;
  limit_req_zone $binary_remote_addr zone=capability_per_ip:10m rate=30r/s;
  limit_conn_zone $binary_remote_addr zone=capability_connections:10m;

  server {
    listen 8080;
    server_name _;

    location = /healthz { return 204; }

    # Capability routes have one owner: management-api.
    location ~ ^/v1/public/payment-links(?:/|$) {
      limit_req zone=capability_per_ip burst=60 nodelay;
      limit_conn capability_connections 20;
      proxy_ssl_server_name on;
      proxy_ssl_name management-api;
      proxy_ssl_verify on;
      proxy_ssl_trusted_certificate /run/secrets/management-ca.pem;
      proxy_pass https://management-api:8445;
    }
    location ~ ^/v1/payment-links(?:/|$) {
      limit_req zone=capability_per_ip burst=60 nodelay;
      limit_conn capability_connections 20;
      proxy_ssl_server_name on;
      proxy_ssl_name management-api;
      proxy_ssl_verify on;
      proxy_ssl_trusted_certificate /run/secrets/management-ca.pem;
      proxy_pass https://management-api:8445;
    }
    location ~ ^/v1/checkout-sessions(?:/|$) {
      limit_req zone=capability_per_ip burst=60 nodelay;
      limit_conn capability_connections 20;
      proxy_ssl_server_name on;
      proxy_ssl_name management-api;
      proxy_ssl_verify on;
      proxy_ssl_trusted_certificate /run/secrets/management-ca.pem;
      proxy_pass https://management-api:8445;
    }

    # Closed public catalog consumed by the rate worker through the same
    # externally verified HTTPS origin used in admitted source snapshots.
    location ~ ^/v1/public/rates/(?:coingecko|coinpaprika)/(?:eth-ethereum|sol-solana|ton-ton|trx-tron|usdt-tron)(?:/(?:RUB|USD|EUR|KZT|INR|CNY))?$ {
      limit_req zone=capability_per_ip burst=60 nodelay;
      limit_conn capability_connections 20;
      proxy_pass http://api:8080;
    }

    # Merchant-HMAC core API. Keep explicit to prevent accidental route capture.
    location ~ ^/v1/(payment-intents|payment-proofs|assets|events|transfers|quotes|balances|reconciliation|reconciliation-reports|operator)(/|$) {
      proxy_pass http://api:8080;
    }

    # The browser reaches management/platform only through this BFF path.
    location ^~ /admin/v1/ { proxy_pass http://admin-api:8081; }
    location / { return 404; }
  }
}
