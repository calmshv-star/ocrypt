  annotations: {}
  # Example for ingress-nginx: nginx.ingress.kubernetes.io/backend-protocol: HTTPS
  # Production must also verify the private management CA/SNI at the controller.
  managementAnnotations: {}
  # Operator attestation that the chosen ingress validates backend CA and SNI.
  managementTLSVerified: false
  # Controller-specific request/connection limit annotations for capabilities.
  publicCapabilityRateLimitAnnotations: {}
  # Operator attestation that capability routes have edge rate limits.
  publicCapabilityRateLimitVerified: false
  publicHost: api.example.invalid
  adminHost: admin.example.invalid
  tls: []
  coreAPIPaths:
    - /v1/payment-intents
    - /v1/payment-proofs
    - /v1/assets
    - /v1/events
    - /v1/transfers
    - /v1/quotes
    - /v1/balances
    - /v1/reconciliation
    - /v1/reconciliation-reports
    - /v1/operator

networkPolicy:
  enabled: true
  dns:
    namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
    podSelector: {matchLabels: {k8s-app: kube-dns}}
  healthIngressFrom: []
  edgeIngressFrom: []
  databasePeers: []
  databasePorts: [5432]

platformOutbox:
  # Set true only together with an admitted platform-outbox-publisher and the
  # live destination evidence required by the release manifest.
  claimExternalPublication: false

observability:
  prometheusRule:
    enabled: false
