{{- $root := . -}}
{{- range $name, $cfg := .Values.workloads }}
{{- if $cfg.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "merchant.fullname" $root }}-{{ $name }}
  labels:
    {{- include "merchant.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
  {{- with $cfg.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "merchant.fullname" $root }}-{{ $name }}
  labels:
    {{- include "merchant.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  replicas: {{ $cfg.replicas }}
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels:
      {{- include "merchant.selectorLabels" (dict "root" $root "component" $name) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "merchant.selectorLabels" (dict "root" $root "component" $name) | nindent 8 }}
      {{- with $root.Values.global.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "merchant.fullname" $root }}-{{ $name }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        {{- include "merchant.podSecurityContext" $root | nindent 8 }}
      {{- with $root.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $root.Values.global.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "merchant.selectorLabels" (dict "root" $root "component" $name) | nindent 14 }}
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "merchant.selectorLabels" (dict "root" $root "component" $name) | nindent 14 }}
      containers:
        - name: service
          image: {{ include "merchant.image" $cfg.image | quote }}
          imagePullPolicy: {{ $cfg.image.pullPolicy }}
          securityContext:
            {{- include "merchant.containerSecurityContext" $root | nindent 12 }}
          env:
            {{- range $key, $value := $cfg.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- range $item := $cfg.secretEnv }}
            - name: {{ $item.name }}
              valueFrom:
                secretKeyRef:
                  name: {{ $item.secretRef.name | quote }}
                  key: {{ $item.secretRef.key | quote }}
            {{- end }}
            {{- if $cfg.workerIDEnv }}
            - name: {{ $cfg.workerIDEnv }}
              valueFrom:
                fieldRef: {fieldPath: metadata.uid}
            {{- end }}
          ports:
            - name: health
              containerPort: {{ $cfg.port }}
              protocol: TCP
            {{- range $extraPort := $cfg.extraPorts }}
            - name: {{ $extraPort.name }}
              containerPort: {{ $extraPort.containerPort }}
              protocol: {{ default "TCP" $extraPort.protocol }}
            {{- end }}
          startupProbe:
            {{- if or (eq $name "platform-outbox-publisher") (eq $name "financial-api") (eq $name "retention-control-scheduler") }}
            exec:
              command: [/app/probe, /healthz]
            {{- else }}
            httpGet: {path: /healthz, port: health, scheme: {{ $cfg.probeScheme }}}
            {{- end }}
            failureThreshold: 30
            periodSeconds: 2
            timeoutSeconds: 2
          readinessProbe:
            {{- if or (eq $name "platform-outbox-publisher") (eq $name "financial-api") (eq $name "retention-control-scheduler") }}
            exec:
              command: [/app/probe, /readyz]
            {{- else }}
            httpGet: {path: /readyz, port: health, scheme: {{ $cfg.probeScheme }}}
            {{- end }}
            failureThreshold: 3
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            {{- if or (eq $name "platform-outbox-publisher") (eq $name "financial-api") (eq $name "retention-control-scheduler") }}
            exec:
              command: [/app/probe, /healthz]
            {{- else }}
            httpGet: {path: /healthz, port: health, scheme: {{ $cfg.probeScheme }}}
            {{- end }}
            failureThreshold: 3
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            {{- toYaml $cfg.resources | nindent 12 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            {{- range $index, $file := $cfg.secretFiles }}
            - name: secret-{{ $index }}
              mountPath: {{ $file.path | quote }}
              subPath: value
              readOnly: true
            {{- end }}
            {{- range $index, $directory := $cfg.secretDirectories }}
            - name: secret-dir-{{ $index }}
              mountPath: {{ $directory.path | quote }}
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 32Mi}
        {{- range $index, $file := $cfg.secretFiles }}
        - name: secret-{{ $index }}
          secret:
            secretName: {{ $file.secretRef.name | quote }}
            defaultMode: 0400
            items:
              - {key: {{ $file.secretRef.key | quote }}, path: value}
        {{- end }}
        {{- range $index, $directory := $cfg.secretDirectories }}
        - name: secret-dir-{{ $index }}
          secret:
            secretName: {{ $directory.secretRef.name | quote }}
            defaultMode: 0400
        {{- end }}
{{- if $cfg.service.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "merchant.fullname" $root }}-{{ $name }}
  labels:
    {{- include "merchant.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  type: ClusterIP
  selector:
    {{- include "merchant.selectorLabels" (dict "root" $root "component" $name) | nindent 4 }}
  ports:
    - name: {{ $cfg.service.portName }}
      port: {{ $cfg.service.port }}
      targetPort: {{ default "health" $cfg.service.targetPortName }}
      protocol: TCP
      appProtocol: {{ default (lower $cfg.probeScheme) $cfg.service.appProtocol | quote }}
{{- end }}
{{- if $cfg.pdb.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "merchant.fullname" $root }}-{{ $name }}
spec:
  minAvailable: {{ $cfg.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "merchant.selectorLabels" (dict "root" $root "component" $name) | nindent 6 }}
{{- end }}
{{- if $cfg.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "merchant.fullname" $root }}-{{ $name }}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: {{ include "merchant.fullname" $root }}-{{ $name }}}
  minReplicas: {{ $cfg.autoscaling.minReplicas }}
  maxReplicas: {{ $cfg.autoscaling.maxReplicas }}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies: [{type: Percent, value: 25, periodSeconds: 60}]
    scaleUp:
      stabilizationWindowSeconds: 60
      policies: [{type: Percent, value: 100, periodSeconds: 60}, {type: Pods, value: 2, periodSeconds: 60}]
      selectPolicy: Max
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: {{ $cfg.autoscaling.targetCPUUtilizationPercentage }}}
{{- end }}
{{- end }}
{{- end }}
