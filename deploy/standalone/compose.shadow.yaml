name: ocrypt-standalone

x-runtime: &runtime
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "3"

services:
  api:
    <<: *runtime
    image: ocrypt-api:20260812-public-assets5
    container_name: ocrypt-api
    environment:
      APP_ENV: production
      DATABASE_URL: ${API_DATABASE_URL:?}
      API_CREDENTIAL_ENVELOPE_KEY: ${API_CREDENTIAL_ENVELOPE_KEY:?}
      HTTP_ADDRESS: ":8080"
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?}
      RATE_SOURCE_GATEWAY_ENABLED: "true"
      AUTH_NONCE_CLEANUP_INTERVAL: 1m
      AUTH_NONCE_CLEANUP_BATCH: "10000"
      AUTH_NONCE_CLEANUP_MAX_BATCHES: "5"
    ports: ["127.0.0.1:8084:8080"]
    networks: [data, core]

  core-proxy:
    <<: *runtime
    image: nginx:1.29-alpine
    container_name: ocrypt-core-proxy
    user: "101:101"
    entrypoint: ["nginx", "-g", "daemon off;"]
    depends_on: [api]
    tmpfs:
      - "/tmp:rw,noexec,nosuid,size=16m,uid=101,gid=101,mode=700"
    volumes:
      - /opt/ocrypt/config/core-proxy.conf:/etc/nginx/nginx.conf:ro
      - /opt/ocrypt/tls/core-server.crt:/run/tls/server.crt:ro
      - /opt/ocrypt/tls/core-server.key:/run/tls/server.key:ro
      - /opt/ocrypt/tls/ca.crt:/run/tls/ca.crt:ro
    networks:
      core:
        aliases: [core.ocrypt.internal]

  management-api:
    <<: *runtime
    image: ocrypt-management-api:20260812-receiptfix2
    container_name: ocrypt-management-api
    environment:
      DATABASE_URL: ${MANAGEMENT_DATABASE_URL:?}
      MANAGEMENT_HTTP_ADDRESS: ":8445"
      MANAGEMENT_PUBLIC_BASE_URL: https://pay.example.com
      MANAGEMENT_TLS_CERT_FILE: /run/secrets/management.crt
      MANAGEMENT_TLS_KEY_FILE: /run/secrets/management.key
      WEBHOOK_ENVELOPE_KEY_FILE: /run/secrets/webhook-envelope-key
      API_CREDENTIAL_ENVELOPE_KEY_FILE: /run/secrets/credential-envelope-key
      MANAGEMENT_RESPONSE_KEY_FILE: /run/secrets/response-key
      MANAGEMENT_ADMIN_ASSERTION_KEY_FILE: /run/secrets/assertion-key
      RECEIPT_AI_API_KEY_FILE: /run/secrets/receipt-ai-api-key
    volumes:
      - /opt/ocrypt/tls/management.crt:/run/secrets/management.crt:ro
      - /opt/ocrypt/tls/management.key:/run/secrets/management.key:ro
      - /opt/ocrypt/secrets/credential-envelope-key:/run/secrets/credential-envelope-key:ro
      - /opt/ocrypt/secrets/webhook-envelope-key:/run/secrets/webhook-envelope-key:ro
      - /opt/ocrypt/secrets/management-response-key:/run/secrets/response-key:ro
      - /opt/ocrypt/secrets/management-assertion-key:/run/secrets/assertion-key:ro
      - /opt/ocrypt/secrets/polza-api-key:/run/secrets/receipt-ai-api-key:ro
    ports: ["127.0.0.1:8445:8445"]
    networks:
      data:
        aliases: [management-api.ocrypt.internal]

  legacy-gateway:
    <<: *runtime
    image: ocrypt-legacy-gateway:20260811
    container_name: ocrypt-legacy
    depends_on: [core-proxy]
    environment:
      APP_ENV: production
      LEGACY_COMPAT_ENABLED: "true"
      LEGACY_DATABASE_URL: ${LEGACY_DATABASE_URL:?}
      LEGACY_HTTP_ADDRESS: ":8082"
      LEGACY_HEALTH_ADDRESS: ":9101"
      LEGACY_PUBLIC_BASE_URL: https://pay.example.com
      LEGACY_CHECKOUT_BASE_URL: https://pay.example.com
      LEGACY_SECRET_DIR: /run/secrets/legacy
      LEGACY_CORE_URL: https://core.ocrypt.internal:8443
      LEGACY_CORE_CA_FILE: /run/tls/ca.crt
      LEGACY_CORE_SERVER_NAME: core.ocrypt.internal
      LEGACY_CORE_CLIENT_CERT_FILE: /run/tls/client.crt
      LEGACY_CORE_CLIENT_KEY_FILE: /run/tls/client.key
      LEGACY_WORKER_ID: ocrypt-legacy-1
      LEGACY_SUNSET_AT: "2027-02-01T00:00:00Z"
      LEGACY_POLL_INTERVAL: 2s
      LEGACY_CALLBACK_LEASE: 30s
      LEGACY_BATCH_SIZE: "50"
    volumes:
      - /opt/ocrypt/secrets/legacy-compat:/run/secrets/legacy:ro
      - /opt/ocrypt/tls/ca.crt:/run/tls/ca.crt:ro
      - /opt/ocrypt/tls/legacy-client.crt:/run/tls/client.crt:ro
      - /opt/ocrypt/tls/legacy-client.key:/run/tls/client.key:ro
    ports:
      - "127.0.0.1:8283:8082"
      - "127.0.0.1:9101:9101"
    networks: [data, core, merchant]

  plan-worker:
    <<: *runtime
    image: ocrypt-worker:20260811-receipts
    container_name: ocrypt-plan-worker
    environment:
      DATABASE_URL: ${PLAN_DATABASE_URL:?}
      WORKER_ID: ocrypt-plan-1
      WORKER_ROLES: plans
      WORKER_HEALTH_ADDRESS: ":9090"
    networks: [data]

  settlement-worker:
    <<: *runtime
    image: ocrypt-worker:20260812-chainfix3
    container_name: ocrypt-settlement-worker
    environment:
      DATABASE_URL: ${SETTLEMENT_DATABASE_URL:?}
      WORKER_ID: ocrypt-settlement-1
      WORKER_ROLES: settlements
      WORKER_HEALTH_ADDRESS: ":9090"
    networks: [data]

  callback-worker:
    <<: *runtime
    profiles: [webhook-delivery]
    image: ocrypt-worker:20260813-unified-webhook-runtime-v2
    container_name: ocrypt-callback-worker
    environment:
      DATABASE_URL_FILE: /run/secrets/database-url
      WEBHOOK_ENVELOPE_KEY_FILE: /run/secrets/webhook-envelope-key
      WORKER_ID: ocrypt-callback-1
      WORKER_ROLES: callbacks
      WORKER_HEALTH_ADDRESS: ":9090"
    volumes:
      - /opt/ocrypt/secrets/ocrypt_callback-dsn.runtime:/run/secrets/database-url:ro
      - /opt/ocrypt/secrets/ocrypt_callback-webhook-key.runtime:/run/secrets/webhook-envelope-key:ro
    networks: [data, edge]

  outbox-worker:
    <<: *runtime
    image: ocrypt-worker:20260814-operational-hygiene
    container_name: ocrypt-outbox-worker
    environment:
      APP_ENV: production
      DATABASE_URL_FILE: /run/secrets/database-url
      WORKER_ID: ocrypt-outbox-1
      WORKER_ROLES: outbox
      WORKER_HEALTH_ADDRESS: ":9090"
      OUTBOX_PUBLISHER: history
      OUTBOX_HISTORY_SINK_ACKNOWLEDGED: "true"
      OUTBOX_MAX_RETRY_DELAY: 15m
    volumes:
      - /opt/ocrypt/secrets/ocrypt_outbox-dsn.runtime:/run/secrets/database-url:ro
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
    networks: [data]

  scanner-tron:
    <<: *runtime
    image: ocrypt-scanner:20260812-watch6
    container_name: ocrypt-scanner-tron
    env_file: [/opt/ocrypt/config/scanner-tron.env]
    networks: [data]

  scanner-ethereum:
    <<: *runtime
    image: ocrypt-scanner:20260812-watch6
    container_name: ocrypt-scanner-ethereum
    env_file: [/opt/ocrypt/config/scanner-ethereum.env]
    networks: [data]

  scanner-solana:
    <<: *runtime
    image: ocrypt-scanner:20260812-watch6
    container_name: ocrypt-scanner-solana
    env_file: [/opt/ocrypt/config/scanner-solana.env]
    networks: [data]

  scanner-ton:
    <<: *runtime
    image: ocrypt-scanner:20260812-watch6
    container_name: ocrypt-scanner-ton
    env_file: [/opt/ocrypt/config/scanner-ton.env]
    networks: [data]

  scanner-base:
    <<: *runtime
    image: ocrypt-scanner:20260812-watch6
    container_name: ocrypt-scanner-base
    env_file: [/opt/ocrypt/config/scanner-base.env]
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
    networks: [data]

  scanner-arbitrum:
    <<: *runtime
    image: ocrypt-scanner:20260812-watch6
    container_name: ocrypt-scanner-arbitrum
    env_file: [/opt/ocrypt/config/scanner-arbitrum.env]
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
    networks: [data]

  scanner-optimism:
    <<: *runtime
    image: ocrypt-scanner:20260812-watch6
    container_name: ocrypt-scanner-optimism
    env_file: [/opt/ocrypt/config/scanner-optimism.env]
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
    networks: [data]

  scanner-avalanche:
    <<: *runtime
    image: ocrypt-scanner:20260812-watch6
    container_name: ocrypt-scanner-avalanche
    env_file: [/opt/ocrypt/config/scanner-avalanche.env]
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
    networks: [data]

  scanner-polygon:
    <<: *runtime
    image: ocrypt-scanner:20260812-watch6
    container_name: ocrypt-scanner-polygon
    env_file: [/opt/ocrypt/config/scanner-polygon.env]
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
    networks: [data]

  scanner-bsc:
    <<: *runtime
    image: ocrypt-scanner:20260812-watch6
    container_name: ocrypt-scanner-bsc
    env_file: [/opt/ocrypt/config/scanner-bsc.env]
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
    networks: [data]

  scanner-plasma:
    <<: *runtime
    image: ocrypt-scanner:20260812-watch6
    container_name: ocrypt-scanner-plasma
    env_file: [/opt/ocrypt/config/scanner-plasma.env]
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
    networks: [data]

  scanner-aptos:
    <<: *runtime
    profiles: [aptos-disabled]
    image: ocrypt-scanner:20260812-watch6
    container_name: ocrypt-scanner-aptos
    env_file: [/opt/ocrypt/config/scanner-aptos.env]
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
    volumes:
      - /opt/ocrypt/secrets/scanner:/run/secrets/scanner:ro
    networks: [data]

  proof-worker-tron:
    <<: *runtime
    image: ocrypt-worker:20260823-fastproof-v2
    container_name: ocrypt-proof-worker-tron
    env_file: [/opt/ocrypt/config/scanner-tron.env, /opt/ocrypt/config/proof-tron.env]
    environment: {PROOF_VERIFIER_DATABASE_ONLY: "false", PROOF_VERIFIER_USE_SCANNER_CONFIG: "true"}
    networks: [data]

  proof-worker-ethereum:
    <<: *runtime
    image: ocrypt-worker:20260823-fastproof-v2
    container_name: ocrypt-proof-worker-ethereum
    env_file: [/opt/ocrypt/config/scanner-ethereum.env, /opt/ocrypt/config/proof-ethereum.env]
    environment: {PROOF_VERIFIER_DATABASE_ONLY: "false", PROOF_VERIFIER_USE_SCANNER_CONFIG: "true"}
    networks: [data]

  proof-worker-solana:
    <<: *runtime
    image: ocrypt-worker:20260823-fastproof-v2
    container_name: ocrypt-proof-worker-solana
    env_file: [/opt/ocrypt/config/scanner-solana.env, /opt/ocrypt/config/proof-solana.env]
    environment: {PROOF_VERIFIER_DATABASE_ONLY: "false", PROOF_VERIFIER_USE_SCANNER_CONFIG: "true"}
    networks: [data]

  proof-worker-ton:
    <<: *runtime
    image: ocrypt-worker:20260823-fastproof-v2
    container_name: ocrypt-proof-worker-ton
    env_file: [/opt/ocrypt/config/scanner-ton.env, /opt/ocrypt/config/proof-ton.env]
    environment: {PROOF_VERIFIER_DATABASE_ONLY: "false", PROOF_VERIFIER_USE_SCANNER_CONFIG: "true"}
    networks: [data]

  proof-worker-base:
    <<: *runtime
    image: ocrypt-worker:20260823-fastproof-v2
    container_name: ocrypt-proof-worker-base
    env_file: [/opt/ocrypt/config/scanner-base.env, /opt/ocrypt/config/proof-base.env]
    environment: {PROOF_VERIFIER_DATABASE_ONLY: "false", PROOF_VERIFIER_USE_SCANNER_CONFIG: "true"}
    networks: [data]

  proof-worker-arbitrum:
    <<: *runtime
    image: ocrypt-worker:20260823-fastproof-v2
    container_name: ocrypt-proof-worker-arbitrum
    env_file: [/opt/ocrypt/config/scanner-arbitrum.env, /opt/ocrypt/config/proof-arbitrum.env]
    environment: {PROOF_VERIFIER_DATABASE_ONLY: "false", PROOF_VERIFIER_USE_SCANNER_CONFIG: "true"}
    networks: [data]

  proof-worker-optimism:
    <<: *runtime
    image: ocrypt-worker:20260823-fastproof-v2
    container_name: ocrypt-proof-worker-optimism
    env_file: [/opt/ocrypt/config/scanner-optimism.env, /opt/ocrypt/config/proof-optimism.env]
    environment: {PROOF_VERIFIER_DATABASE_ONLY: "false", PROOF_VERIFIER_USE_SCANNER_CONFIG: "true"}
    networks: [data]

  proof-worker-avalanche:
    <<: *runtime
    image: ocrypt-worker:20260823-fastproof-v2
    container_name: ocrypt-proof-worker-avalanche
    env_file: [/opt/ocrypt/config/scanner-avalanche.env, /opt/ocrypt/config/proof-avalanche.env]
    environment: {PROOF_VERIFIER_DATABASE_ONLY: "false", PROOF_VERIFIER_USE_SCANNER_CONFIG: "true"}
    networks: [data]

  proof-worker-polygon:
    <<: *runtime
    image: ocrypt-worker:20260823-fastproof-v2
    container_name: ocrypt-proof-worker-polygon
    env_file: [/opt/ocrypt/config/scanner-polygon.env, /opt/ocrypt/config/proof-polygon.env]
    environment: {PROOF_VERIFIER_DATABASE_ONLY: "false", PROOF_VERIFIER_USE_SCANNER_CONFIG: "true"}
    networks: [data]

  proof-worker-bsc:
    <<: *runtime
    image: ocrypt-worker:20260823-fastproof-v2
    container_name: ocrypt-proof-worker-bsc
    env_file: [/opt/ocrypt/config/scanner-bsc.env, /opt/ocrypt/config/proof-bsc.env]
    environment: {PROOF_VERIFIER_DATABASE_ONLY: "false", PROOF_VERIFIER_USE_SCANNER_CONFIG: "true"}
    networks: [data]

  proof-worker-plasma:
    <<: *runtime
    image: ocrypt-worker:20260823-fastproof-v2
    container_name: ocrypt-proof-worker-plasma
    env_file: [/opt/ocrypt/config/scanner-plasma.env, /opt/ocrypt/config/proof-plasma.env]
    environment: {PROOF_VERIFIER_DATABASE_ONLY: "false", PROOF_VERIFIER_USE_SCANNER_CONFIG: "true"}
    networks: [data]

  proof-worker-aptos:
    <<: *runtime
    profiles: [aptos-disabled]
    image: ocrypt-worker:20260823-fastproof-v2
    container_name: ocrypt-proof-worker-aptos
    env_file: [/opt/ocrypt/config/scanner-aptos.env, /opt/ocrypt/config/proof-aptos.env]
    environment: {PROOF_VERIFIER_DATABASE_ONLY: "false", PROOF_VERIFIER_USE_SCANNER_CONFIG: "true"}
    networks: [data]

  matching-worker:
    <<: *runtime
    image: ocrypt-worker:20260811-receipts
    container_name: ocrypt-matching-worker
    environment:
      DATABASE_URL: ${MATCHING_DATABASE_URL:?}
      WORKER_ID: ocrypt-matching-1
      WORKER_ROLES: matching
      WORKER_HEALTH_ADDRESS: ":9090"
    networks: [data]

  rate-worker:
    <<: *runtime
    image: ocrypt-rate-worker:20260811-receipts
    container_name: ocrypt-rate-worker
    environment:
      DATABASE_URL: ${RATE_DATABASE_URL:?}
      RATE_WORKER_ID: 0198a100-0000-7000-8000-000000000050
      RATE_TARGETS_JSON: >-
        [{"policy_key":"rate-eth-ethereum-rub"},{"policy_key":"rate-usdc-ethereum-rub"},{"policy_key":"rate-usdt-ethereum-rub"},{"policy_key":"rate-sol-solana-rub"},{"policy_key":"rate-usdc-solana-rub"},{"policy_key":"rate-usdt-solana-rub"},{"policy_key":"rate-ton-ton-rub"},{"policy_key":"rate-usdt-ton-rub"},{"policy_key":"rate-trx-tron-rub"},{"policy_key":"rate-usdt-tron-rub"},{"policy_key":"rate-eth-base-rub"},{"policy_key":"rate-usdc-base-rub"},{"policy_key":"rate-eth-arbitrum-rub"},{"policy_key":"rate-usdc-arbitrum-rub"},{"policy_key":"rate-eth-optimism-rub"},{"policy_key":"rate-usdc-optimism-rub"},{"policy_key":"rate-avax-avalanche-rub"},{"policy_key":"rate-usdc-avalanche-rub"},{"policy_key":"rate-pol-polygon-rub"},{"policy_key":"rate-usdc-polygon-rub"},{"policy_key":"rate-usdt-polygon-rub"},{"policy_key":"rate-usdce-polygon-rub"},{"policy_key":"rate-bnb-bsc-rub"},{"policy_key":"rate-usdt-bsc-rub"},{"policy_key":"rate-usdc-bsc-rub"},{"policy_key":"rate-usdt-plasma-rub"}]
      # This is a cheap database wake-up check. External sources are contacted
      # only for due jobs (30 minutes) or a stale checkout request.
      RATE_POLL_INTERVAL: 1s
      RATE_SOURCE_MIN_INTERVAL: 150ms
      RATE_LEASE_DURATION: 30s
      RATE_MAX_READY_AGE: 35m
      RATE_MAX_ATTEMPTS: "20"
      RATE_HEALTH_ADDRESS: ":9092"
    networks: [data, edge]

  checkout:
    <<: *runtime
    image: nginx:1.29-alpine
    container_name: ocrypt-checkout
    user: "101:101"
    entrypoint: ["nginx", "-g", "daemon off;"]
    tmpfs:
      - "/tmp:rw,noexec,nosuid,size=16m,uid=101,gid=101,mode=700"
    volumes:
      - /opt/ocrypt/web/checkout:/usr/share/nginx/html:ro
      - /opt/ocrypt/config/checkout-nginx.conf:/etc/nginx/nginx.conf:ro
    ports: ["127.0.0.1:4174:8080"]
    networks: [edge]

networks:
  data:
    external: true
    name: ocrypt-data
  merchant:
    external: true
    name: ocrypt-integrations
  core:
    name: ocrypt-core
    internal: true
  edge:
    name: ocrypt-edge
