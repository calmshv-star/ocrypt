events {
    worker_connections 4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    limit_req_zone $binary_remote_addr zone=ocrypt_public:10m rate=20r/s;

    server {
        listen 80;
        listen [::]:80;
        server_name pay.example.com api.pay.example.com;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type text/plain;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name pay.example.com;
        access_log off;

        ssl_certificate /etc/letsencrypt/live/pay.example.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/pay.example.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:OCRYPT_SSL:10m;
        ssl_session_timeout 1d;

        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        client_max_body_size 1m;

        location ^~ /v1/public/payment-links/ {
            limit_req zone=ocrypt_public burst=40 nodelay;
            proxy_pass https://127.0.0.1:8445;
            proxy_ssl_trusted_certificate /opt/ocrypt/tls/ca.crt;
            proxy_ssl_verify on;
            proxy_ssl_protocols TLSv1.3;
            proxy_ssl_server_name on;
            proxy_ssl_name management-api.ocrypt.internal;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
        }

        location ~ ^/v1/checkout-sessions/[^/]+/receipt$ {
            client_max_body_size 5m;
            limit_req zone=ocrypt_public burst=10 nodelay;
            proxy_pass https://127.0.0.1:8445;
            proxy_ssl_trusted_certificate /opt/ocrypt/tls/ca.crt;
            proxy_ssl_verify on;
            proxy_ssl_protocols TLSv1.3;
            proxy_ssl_server_name on;
            proxy_ssl_name management-api.ocrypt.internal;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 3s;
            proxy_read_timeout 35s;
        }

        location /v1/checkout-sessions/ {
            limit_req zone=ocrypt_public burst=40 nodelay;
            proxy_pass https://127.0.0.1:8445;
            proxy_ssl_trusted_certificate /opt/ocrypt/tls/ca.crt;
            proxy_ssl_verify on;
            proxy_ssl_protocols TLSv1.3;
            proxy_ssl_server_name on;
            proxy_ssl_name management-api.ocrypt.internal;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
        }

        location ^~ /pay/check-status/ {
            limit_req zone=ocrypt_public burst=20 nodelay;
            proxy_pass http://127.0.0.1:8283;
            proxy_set_header Host $host;
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Real-IP "";
            proxy_connect_timeout 3s;
            proxy_read_timeout 10s;
        }

        location ^~ /pay/checkout-counter/ {
            limit_req zone=ocrypt_public burst=20 nodelay;
            proxy_pass http://127.0.0.1:8283;
            proxy_set_header Host $host;
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Real-IP "";
            proxy_connect_timeout 3s;
            proxy_read_timeout 10s;
        }

        location ^~ /legacy/ {
            return 404;
        }

        location / {
            proxy_pass http://127.0.0.1:4174;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
        }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name api.pay.example.com;
        access_log off;

        ssl_certificate /etc/letsencrypt/live/pay.example.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/pay.example.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:OCRYPT_SSL:10m;
        ssl_session_timeout 1d;
        client_max_body_size 1m;

        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;

        location = /healthz { return 404; }
        location = /readyz { return 404; }
        location = /metrics { return 404; }

        location / {
            limit_req zone=ocrypt_public burst=40 nodelay;
            proxy_pass http://127.0.0.1:8084;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
        }
    }
}
