{{ template "header.html" . }}

<div class="theme-panel">
  <div class="theme-panel__head">
    <span class="theme-panel__eyebrow">Административная панель</span>
    <h2 class="theme-heading">Вход в Ocrypt</h2>
    <p>Введите логин и пароль владельца.</p>
  </div>
  <form method="post" action="{{ .PostURL }}">
    <div class="theme-form-row">
      <div class="theme-form-label">
        <label for="login">Логин</label>
      </div>
	  <input autocomplete="username" autocapitalize="none" spellcheck="false" tabindex="1" required id="login" name="login" type="text" class="theme-form-input" placeholder="owner" {{ if .Username }} value="{{ .Username }}" {{ else }} autofocus {{ end }}/>
    </div>
    <div class="theme-form-row">
      <div class="theme-form-label">
        <label for="password">Пароль</label>
      </div>
	  <input autocomplete="current-password" tabindex="2" required id="password" name="password" type="password" class="theme-form-input" placeholder="Введите пароль" {{ if .Invalid }} autofocus {{ end }}/>
    </div>

    {{ if .Invalid }}
      <div id="login-error" class="dex-error-box">
        Неверный логин или пароль.
      </div>
    {{ end }}

    <button tabindex="3" id="submit-login" type="submit" class="dex-btn theme-btn--primary"><span>Войти</span><span aria-hidden="true">→</span></button>

  </form>
  {{ if .BackLink }}
  <div class="theme-link-back">
    <a class="dex-subtle-text" href="{{ .BackLink }}">Выбрать другой способ входа</a>
  </div>
  {{ end }}
  <p class="theme-panel__foot">Доступ только для авторизованных сотрудников</p>
</div>


<script type="text/javascript">
  document.querySelector('form').onsubmit = function(e) {
    var el = document.querySelector('#submit-login');
    el.setAttribute('disabled', 'disabled');
  };
</script>

{{ template "footer.html" . }}
